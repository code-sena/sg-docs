<script data-purpose="otp-handling">
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('.otp-input');

      inputs.forEach((input, index) => {
        // Automatically move to the next input on numeric typing
        input.addEventListener('input', (e) => {
          const val = e.target.value;
          if (val.length >= 1) {
            e.target.value = val.slice(0, 1);
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          }
        });

        // Handle backspace navigation between inputs
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Handle paste for the whole 6-digit code
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
          if (/^\d+$/.test(pastedData)) {
            const digits = pastedData.slice(0, inputs.length).split('');
            digits.forEach((digit, i) => {
              if (inputs[i]) {
                inputs[i].value = digit;
              }
            });
            const nextFocusIndex = Math.min(digits.length, inputs.length - 1);
            inputs[nextFocusIndex].focus();
          }
        });
      });
    });
  </script>
