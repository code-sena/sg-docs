<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guardian Escolar - Cambiar teléfono</title>
<!-- Load Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9eaff',
              500: '#1d64db',
              600: '#1a56db',
              700: '#1544af',
              800: '#163b93',
              900: '#0f2766',
            },
            appBg: '#eef2f6',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom styles for pixel-perfect details -->
<style data-purpose="custom-layout">
    body {
      background-color: #edf2f7;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased text-slate-800 bg-[#edf2f7]">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-white border-b border-slate-200/80 px-6 py-4 flex items-center relative" data-purpose="site-header">
<!-- Left: Brand Shield Icon -->
<div class="flex items-center" data-purpose="header-logo">
<div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm hover:opacity-95 transition-opacity cursor-pointer">
<!-- Shield Icon SVG -->
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"></path>
</svg>
</div>
</div>
<!-- Center: Application Title -->
<div class="absolute inset-x-0 mx-auto text-center pointer-events-none">
<h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Guardian Escolar</h1>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12" data-purpose="main-wrapper">
<!-- Verification Card Container -->
<div class="w-full max-w-[850px] bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-slate-100" data-purpose="card-container">
<!-- BEGIN: LeftInfoPanel -->
<section class="w-full md:w-5/12 bg-gradient-to-b from-[#1c50b8] via-[#1b4cb3] to-[#2563eb] p-8 sm:p-10 text-white flex flex-col justify-between relative" data-purpose="left-brand-panel">
<!-- Top Section of Left Panel -->
<div>
<!-- Rounded Phone Icon Badge -->
<div class="w-12 h-12 rounded-xl bg-white/15 flex items-center justify-center mb-6 shadow-inner backdrop-blur-sm" data-purpose="phone-badge">
<svg class="w-6 h-6 text-white fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
</svg>
</div>
<!-- Main Title & Description -->
<h2 class="text-2xl sm:text-[26px] font-bold tracking-tight mb-2">Cambiar teléfono</h2>
<p class="text-white/85 text-sm sm:text-[15px] leading-relaxed">
            Por seguridad, verifica tu número de contacto.
          </p>
</div>
<!-- Support Info Container at Bottom -->
<div class="mt-12 bg-white/10 backdrop-blur-sm rounded-xl p-4 sm:p-5 border border-white/15" data-purpose="support-box">
<p class="text-xs sm:text-sm text-white/95 leading-relaxed font-normal">
            ¿Necesitas ayuda? Escríbenos a 
            <a class="font-medium underline hover:text-white transition-colors" href="mailto:sch00l.guard4n@gmail.com">sch00l.guard4n@gmail.com</a> 
            o llama al 
            <a class="font-medium hover:underline whitespace-nowrap" href="tel:+573144308274">+57 314 4308274</a>
</p>
</div>
</section>
<!-- END: LeftInfoPanel -->
<!-- BEGIN: RightFormPanel -->
<section class="w-full md:w-7/12 p-8 sm:p-12 bg-white flex flex-col justify-between" data-purpose="right-form-panel">
<div>
<!-- Stepper / Progress Bar -->
<div class="flex items-center justify-between gap-3 mb-8" data-purpose="stepper">
<!-- Progress Line Segments -->
<div class="flex items-center gap-2 flex-1 max-w-[200px]">
<!-- Step 1: Active -->
<span class="h-1 flex-1 bg-blue-600 rounded-full"></span>
<!-- Step 2: Inactive -->
<span class="h-1 flex-1 bg-slate-200 rounded-full"></span>
<!-- Step 3: Inactive -->
<span class="h-1 flex-1 bg-slate-200 rounded-full"></span>
<!-- Step 4: Inactive -->
<span class="h-1 flex-1 bg-slate-200 rounded-full"></span>
</div>
<!-- Step text -->
<span class="text-xs font-semibold text-slate-500 whitespace-nowrap">
              1 de 4
            </span>
</div>
<!-- Step Title -->
<h3 class="text-xl sm:text-2xl font-bold text-slate-800 mb-6">Paso 1</h3>
<!-- Form Element -->
<form action="#" class="space-y-4" data-purpose="phone-verification-form" method="POST" onsubmit="event.preventDefault();">
<div>
<label class="block text-sm font-medium text-slate-700 mb-2" for="phone-input">
                Teléfono
              </label>
<!-- Input field with styled border -->
<input autofocus="" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition-all" id="phone-input" name="phone" placeholder="" type="tel"/>
<!-- Helper text -->
<p class="mt-2 text-xs sm:text-[13px] text-slate-500">
                Ingresa tu número para recibir un código de verificación.
              </p>
</div>
<!-- Submit Button (Centered) -->
<div class="pt-6 flex justify-center">
<button class="px-8 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-full shadow-sm hover:shadow transition-all duration-150 ease-in-out cursor-pointer" data-purpose="submit-btn" type="submit">
                Enviar código
              </button>
</div>
</form>
</div>
<!-- Back Link Button at bottom -->
<div class="pt-8 text-center" data-purpose="back-navigation">
<a class="text-sm font-medium text-blue-600 hover:text-blue-800 inline-flex items-center gap-1.5 transition-colors" href="#">
<span>←</span> Volver
          </a>
</div>
</section>
<!-- END: RightFormPanel -->
</div>
</main>
<!-- END: MainContent -->
</body></html>
