<!-- Script for handling auto-focus flow between OTP fields -->
<script data-purpose="otp-handling">
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('[data-purpose="otp-input-group"] input');
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text').trim();
          if (/^\d+$/.test(text)) {
            const digits = text.slice(0, inputs.length).split('');
            digits.forEach((digit, i) => {
              if (inputs[i]) {
                inputs[i].value = digit;
              }
            });
            const nextIdx = Math.min(digits.length, inputs.length - 1);
            inputs[nextIdx].focus();
          }
        });
      });
    });
  </script>
