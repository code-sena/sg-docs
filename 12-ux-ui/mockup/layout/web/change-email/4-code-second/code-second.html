<!-- BEGIN: AutoFocus & Flow Script -->
<script data-purpose="otp-input-behavior">
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = Array.from(document.querySelectorAll('[data-purpose="otp-inputs"] input'));
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
          if (/^\d+$/.test(pastedData)) {
            const digits = pastedData.split('').slice(0, inputs.length);
            digits.forEach((digit, i) => {
              inputs[i].value = digit;
            });
            const focusTarget = Math.min(digits.length, inputs.length - 1);
            inputs[focusTarget].focus();
          }
        });
      });
    });
  </script>
<!-- END: AutoFocus & Flow Script -->
