<!DOCTYPE html>

<html class="h-full" lang="es"><head>

<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script>

<body class="bg-[#f0f4f9] min-h-full flex flex-col text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-white border-b border-slate-200/80 px-6 py-4 flex items-center relative shadow-sm" data-purpose="top-navigation">
<!-- Brand Logo / Shield Icon -->
<div class="flex items-center" data-purpose="brand-logo-container">
<a aria-label="Inicio Guardian Escolar" class="inline-flex items-center text-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500 rounded-xl" href="#">
<svg class="w-10 h-10 text-brand-600 drop-shadow-sm" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v2h-2V7zm0 4h2v6h-2v-6z" fill-opacity="0"></path>
<path clip-rule="evenodd" d="M12 2.25c-.28 0-.55.08-.78.22L4.62 6.07C3.99 6.44 3.6 7.12 3.6 7.85v4.65c0 5.09 3.5 9.87 8.16 11.23.16.05.32.07.48.07.16 0 .32-.02.48-.07 4.66-1.36 8.16-6.14 8.16-11.23V7.85c0-.73-.39-1.41-1.02-1.78l-6.6-3.6c-.23-.14-.5-.22-.78-.22zm0 3.25c.34 0 .68.1.97.28l4.8 2.8c.4.23.63.66.63 1.12v3.8c0 3.91-2.67 7.57-6.25 8.7a.89.89 0 01-.3 0c-3.58-1.13-6.25-4.79-6.25-8.7V9.7c0-.46.23-.89.63-1.12l4.8-2.8c.29-.18.63-.28.97-.28z" fill-rule="evenodd"></path>
<path d="M12 4.5a.75.75 0 01.37.1l6.23 3.63c.25.15.4.42.4.72v3.9c0 4.35-2.98 8.4-6.85 9.6a.76.76 0 01-.3 0C7.98 21.25 5 17.2 5 12.85V8.95c0-.3.15-.57.4-.72L11.63 4.6a.75.75 0 01.37-.1z" fill="currentColor"></path>
</svg>
</a>
</div>
<!-- Centered Platform Name -->
<div class="absolute inset-x-0 mx-auto text-center pointer-events-none">
<h1 class="text-xl md:text-2xl font-bold text-slate-800 tracking-tight pointer-events-auto">
        Guardian Escolar
      </h1>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8" data-purpose="content-area">
<!-- Card Container -->
<div class="w-full max-w-[890px] bg-white rounded-2xl shadow-[0_10px_35px_-4px_rgba(15,23,42,0.1),0_4px_6px_-2px_rgba(15,23,42,0.05)] overflow-hidden flex flex-col md:flex-row border border-slate-100" data-purpose="registration-modal-card">
<!-- BEGIN: LeftInfoPanel -->
<section class="w-full md:w-[41%] bg-gradient-to-b from-[#1c53bd] to-[#1546a3] text-white p-8 md:p-10 flex flex-col justify-between relative" data-purpose="side-banner-panel">
<!-- Top Section: Mail Icon & Headings -->
<div>
<!-- Translucent Mail Icon Badge -->
<div class="w-13 h-13 p-3.5 bg-white/20 backdrop-blur-sm rounded-2xl inline-flex items-center justify-center mb-6 shadow-inner" data-purpose="icon-wrapper">
<svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="16" rx="3" width="20" x="2" y="4"></rect>
<path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
</svg>
</div>
<!-- Main Callout Heading -->
<h2 class="text-2xl sm:text-3xl font-bold tracking-tight mb-3">
            Casi terminamos
          </h2>
<!-- Descriptive Subtitle -->
<p class="text-blue-100 text-base leading-relaxed">
            Ingresa tu nuevo correo electrónico.
          </p>
</div>
<!-- Bottom Section: Support Help Card -->
<div class="mt-12 md:mt-0 pt-4" data-purpose="support-card-container">
<div class="bg-[#103b87]/70 backdrop-blur-sm rounded-xl p-4 sm:p-5 border border-white/10 text-[13px] leading-relaxed text-blue-100/95 shadow-sm">
<p>
              ¿Necesitas ayuda? Escríbenos a
              <a class="text-white underline font-medium hover:text-blue-200 transition-colors" href="mailto:guardianescolar0@gmail.com">guardianescolar0@gmail.com</a>
              o llama al
              <a class="text-white font-medium hover:underline whitespace-nowrap" href="tel:+573144308274">+57 314 4308274</a>
</p>
</div>
</div>
</section>
<!-- END: LeftInfoPanel -->
<!-- BEGIN: RightFormPanel -->
<section class="w-full md:w-[59%] bg-white p-8 md:p-12 flex flex-col justify-between" data-purpose="form-step-panel">
<!-- Top Area: Step Indicator & Title -->
<div>
<!-- Step Progress Bars -->
<div aria-label="Progreso: Paso 3 de 4" class="flex items-center gap-2 mb-8" data-purpose="step-indicator">
<!-- Step 1: Completed -->
<span class="h-1 w-10 bg-[#1c53bd] rounded-full"></span>
<!-- Step 2: Completed -->
<span class="h-1 w-10 bg-[#1c53bd] rounded-full"></span>
<!-- Step 3: Current -->
<span class="h-1 w-10 bg-[#1c53bd] rounded-full"></span>
<!-- Step 4: Pending -->
<span class="h-1 w-10 bg-slate-200 rounded-full"></span>
<!-- Step Text Counter -->
<span class="text-xs text-slate-500 font-medium ml-2 select-none">3 de 4</span>
</div>
<!-- Section Heading -->
<h3 class="text-2xl sm:text-[26px] font-bold text-slate-900 tracking-tight">
            Nuevo correo
          </h3>
<p class="text-slate-500 text-sm mt-1.5 font-normal">
            Debes ingresar tu nuevo correo
          </p>
<!-- Email Input Form -->
<form class="mt-8 space-y-2" data-purpose="email-update-form" onsubmit="event.preventDefault();">
<div>
<label class="block text-sm font-medium text-slate-800 mb-2" for="new-email">
                Correo electrónico
              </label>
<input class="w-full rounded-lg border-slate-300 px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:border-[#1c53bd] focus:ring-2 focus:ring-[#1c53bd]/20 transition duration-150 shadow-sm outline-none" id="new-email" name="email" placeholder="ejemplo@correo.com" required="" type="email"/>
<p class="mt-2 text-xs text-slate-400">
                Recibirás un código de 6 dígitos
              </p>
</div>
</form>
</div>
<!-- Bottom Area: Primary Action & Return Link -->
<div class="mt-12 flex flex-col items-center gap-5" data-purpose="form-actions">
<!-- Submit Button -->
<button class="px-8 py-2.5 bg-[#1c53bd] hover:bg-[#1546a3] active:bg-[#0f3785] text-white text-sm font-medium rounded-full shadow-md shadow-blue-600/20 hover:shadow-lg transition duration-150 transform active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1c53bd]" type="button">
            Enviar código
          </button>
<!-- Back Navigation Link -->
<a class="inline-flex items-center text-sm font-medium text-[#1c53bd] hover:text-[#1546a3] transition-colors focus:outline-none focus:underline" data-purpose="back-navigation" href="#">
            ← Volver
          </a>
</div>
</section>

</div>
