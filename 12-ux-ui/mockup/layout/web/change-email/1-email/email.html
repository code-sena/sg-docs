<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guardian Escolar - Cambiar correo electrónico</title>
<!-- Load Tailwind CSS v3 with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1e4ebd',
              darkBlue: '#133a94',
              navy: '#102a45',
              pageBg: '#f2f6fc'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-overrides">
    /* Subtle custom focus ring adjustments */
    input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(30, 78, 189, 0.25);
    }
  </style>
</head>
<body class="bg-[#eef3f9] min-h-screen flex flex-col font-sans antialiased text-gray-800">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-white py-4 px-6 md:px-10 border-b border-gray-100 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
<div class="relative max-w-7xl mx-auto flex items-center justify-between">
<!-- Shield Logo on top left -->
<a aria-label="Inicio Guardian Escolar" class="flex items-center group focus:outline-none" href="#">
<div class="w-9 h-9 bg-[#1752c4] rounded-xl flex items-center justify-center shadow-sm">
<svg class="w-5 h-5 text-white fill-current" viewbox="0 0 24 24">
<path d="M12 2L4 5.5v6c0 5.25 3.4 10.15 8 11.5 4.6-1.35 8-6.25 8-11.5v-6L12 2z"></path>
</svg>
</div>
</a>
<!-- Centered Application Title -->
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="text-xl md:text-2xl font-bold tracking-tight text-[#163056]">
          Guardian Escolar
        </h1>
</div>
<!-- Right spacer for optical balance -->
<div aria-hidden="true" class="w-9 h-9 opacity-0 pointer-events-none"></div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex items-center justify-center p-4 md:p-8">
<!-- Centered Card Container -->
<div class="w-full max-w-[880px] bg-white rounded-2xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.06),0_8px_10px_-6px_rgba(0,0,0,0.04)] overflow-hidden flex flex-col md:flex-row min-h-[500px]">
<!-- Left Branding Panel -->
<section aria-label="Información de la sección" class="w-full md:w-[42%] bg-[#1e4ebd] p-8 md:p-10 flex flex-col justify-between text-white">
<div class="space-y-6">
<!-- Envelope Icon Container -->
<div class="w-12 h-12 rounded-xl bg-white/15 flex items-center justify-center backdrop-blur-xs">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Section Headings -->
<div class="space-y-3">
<h2 class="text-2xl font-bold leading-tight">
              Cambiar correo electrónico
            </h2>
<p class="text-sm font-normal text-blue-100/90 leading-relaxed">
              Ingresa el correo que deseas actualizar.
            </p>
</div>
</div>
<!-- Help Notice Box -->
<div class="mt-12 bg-[#123992]/60 rounded-xl p-4 md:p-5 border border-white/5">
<p class="text-xs leading-relaxed text-blue-50/90">
            ¿Necesitas ayuda? Escríbenos a<br/>
<a class="font-medium underline hover:text-white transition-colors" href="mailto:guardianescolar0@gmail.com">guardianescolar0@gmail.com</a><br/>
            o llama al <a class="font-medium hover:text-white transition-colors" href="tel:+573144308274">+57 314 4308274</a>
</p>
</div>
</section>
<!-- Right Form Panel -->
<section aria-label="Formulario de actualización" class="w-full md:w-[58%] p-8 md:p-12 flex flex-col justify-between">
<div>
<!-- Stepper Progress Bar -->
<div class="flex items-center gap-2 mb-8">
<div aria-hidden="true" class="h-1 w-8 rounded-full bg-[#1e4ebd]"></div>
<div aria-hidden="true" class="h-1 w-8 rounded-full bg-gray-200"></div>
<div aria-hidden="true" class="h-1 w-8 rounded-full bg-gray-200"></div>
<div aria-hidden="true" class="h-1 w-8 rounded-full bg-gray-200"></div>
<span class="text-xs text-gray-500 font-medium ml-2 select-none">1 de 4</span>
</div>
<!-- Step Header -->
<div class="mb-8">
<h3 class="text-2xl font-bold text-gray-900 tracking-tight">Paso 1</h3>
<p class="text-sm text-gray-500 mt-1">Debes proporcionar un correo válido.</p>
</div>
<!-- Email Input Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block text-sm font-medium text-gray-700" for="email">
                Correo electrónico
              </label>
<input class="w-full rounded-md border border-gray-300 px-3.5 py-2.5 text-gray-900 shadow-xs focus:border-[#1e4ebd] focus:ring-1 focus:ring-[#1e4ebd] transition duration-150 ease-in-out text-sm" id="email" name="email" placeholder="" required="" type="email"/>
<p class="text-xs text-gray-500">
                Recibirás un código de verificación en este correo.
              </p>
</div>
<!-- Submit Button Container -->
<div class="pt-6 flex justify-center">
<button class="w-auto min-w-[170px] bg-[#1a56cc] hover:bg-[#1546a8] text-white text-sm font-medium py-2.5 px-8 rounded-full shadow-sm transition duration-150 ease-in-out text-center" type="submit">
                Enviar código
              </button>
</div>
</form>
</div>
<!-- Back Link Navigation -->
<div class="mt-8 text-center">
<a class="inline-flex items-center text-xs font-medium text-[#1e4ebd] hover:text-[#133a94] transition-colors" href="#">
            ← Volver
          </a>
</div>
</section>
</div>
</main>
<!-- END: MainContent -->
</body></html>
