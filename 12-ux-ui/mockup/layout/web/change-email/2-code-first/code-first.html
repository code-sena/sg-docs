<script data-purpose="otp-input-auto-focus">
    // Auto-focus behavior and navigation for code inputs
    const inputs = document.querySelectorAll('.otp-input');

    inputs.forEach((input, index) => {
      // Auto-advance to next input
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      // Handle Backspace navigation
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });

      // Handle Paste
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (/^\d+$/.test(pastedData)) {
          pastedData.split('').slice(0, inputs.length).forEach((char, i) => {
            if (inputs[i]) {
              inputs[i].value = char;
            }
          });
          const nextIndex = Math.min(pastedData.length, inputs.length - 1);
          inputs[nextIndex].focus();
        }
      });
    });
  </script>
