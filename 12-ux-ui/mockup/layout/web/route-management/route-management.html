<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Guardian Escolar - Registrar Rutas</title>
    <!-- Tailwind CSS CDN with Forms and Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eef2ff",
                100: "#e0e7ff",
                500: "#2b5aed",
                600: "#1e50e2",
                700: "#1a44c2",
                800: "#16389f",
              },
              canvas: "#f1f4f9",
              inputBg: "#f8fafd",
            },
          },
        },
      };
    </script>
    <!-- BEGIN: Custom Styles -->
    <style data-purpose="custom-scrollbars">
      /* Custom subtle scrollbar styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.25);
      }
    </style>
    <style data-purpose="layout-tweaks">
      /* Custom font rendering adjustments */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
    </style>
    <!-- END: Custom Styles -->
  </head>
  <body
    class="bg-brand-600 text-slate-800 antialiased h-screen overflow-hidden flex flex-col"
  >
    <!-- BEGIN: Top Navigation Bar -->
    <header
      class="h-16 bg-brand-600 flex items-center px-6 text-white relative flex-shrink-0 z-20"
    >
      <!-- Back Button -->
      <a
        class="p-2 rounded-lg hover:bg-white/10 transition-colors inline-flex items-center justify-center text-white"
        href="#"
        title="Volver"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          viewbox="0 0 24 24"
        >
          <path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
      </a>
      <!-- Application Centered Title -->
      <div class="absolute inset-x-0 mx-auto text-center pointer-events-none">
        <h1 class="text-2xl font-bold tracking-normal text-white">
          Guardian Escolar
        </h1>
      </div>
    </header>
    <!-- END: Top Navigation Bar -->
    <!-- BEGIN: Main App Container (Sidebar + Content Workspace) -->
    <div class="flex flex-1 overflow-hidden">
      <!-- BEGIN: Left Sidebar Navigation -->
      <aside
        class="w-64 bg-brand-600 flex flex-col justify-between flex-shrink-0 select-none pb-4"
      >
        <!-- Top Navigation Sections -->
        <nav class="px-4 pt-2 space-y-6 overflow-y-auto">
          <!-- Section: ADMINISTRAR -->
          <div>
            <h2
              class="text-xs font-semibold uppercase tracking-wider text-blue-200/90 px-3 mb-2"
            >
              ADMINISTRAR
            </h2>
            <div class="space-y-1">
              <!-- Estudiante -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-white/90 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current opacity-90"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                  ></path>
                </svg>
                <span>Estudiante</span>
              </a>
              <!-- Acudiente -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-white/90 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current opacity-90"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                  ></path>
                </svg>
                <span>Acudiente</span>
              </a>
              <!-- Conductor -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-white/90 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current opacity-90"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"
                  ></path>
                </svg>
                <span>Conductor</span>
              </a>
              <!-- Familia -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-white/90 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current opacity-90"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                  ></path>
                </svg>
                <span>Familia</span>
              </a>
            </div>
          </div>
          <!-- Section: TRANSPORTE -->
          <div class="pt-2">
            <h2
              class="text-xs font-semibold uppercase tracking-wider text-blue-200/90 px-3 mb-2"
            >
              TRANSPORTE
            </h2>
            <div class="space-y-1.5">
              <!-- Buses -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-white/90 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current opacity-90"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"
                  ></path>
                </svg>
                <span>Buses</span>
              </a>
              <!-- Rutas (Active) -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl bg-white/20 text-white font-semibold shadow-sm backdrop-blur-sm transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                  ></path>
                </svg>
                <span>Rutas</span>
              </a>
              <!-- Paradas -->
              <a
                class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-white/90 hover:bg-white/10 hover:text-white text-sm font-medium transition-colors"
                href="#"
              >
                <svg
                  class="w-5 h-5 flex-shrink-0 fill-current opacity-90"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                  ></path>
                </svg>
                <span>Paradas</span>
              </a>
            </div>
          </div>
        </nav>
        <!-- Bottom Profile Section with Divider -->
        <div class="px-4 pt-4 border-t border-white/20">
          <a
            class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl bg-white/15 text-white font-semibold hover:bg-white/25 transition-all shadow-sm"
            href="#"
          >
            <div class="w-6 h-6 flex-shrink-0 text-white">
              <svg class="w-full h-full fill-white" viewbox="0 0 24 24">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"
                ></path>
              </svg>
            </div>
            <span class="text-sm tracking-wide">Perfil</span>
          </a>
        </div>
      </aside>
      <!-- END: Left Sidebar Navigation -->
      <!-- BEGIN: Workspace Container -->
      <main class="flex-1 bg-canvas p-6 overflow-hidden flex gap-6">
        <!-- BEGIN: Card Registrar Rutas -->
        <section
          class="w-1/2 bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col p-8 h-full overflow-y-auto"
          data-purpose="registration-form-card"
        >
          <!-- Title & Header -->
          <div class="text-center pb-5 border-b border-slate-200/80">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">
              Registrar rutas
            </h2>
          </div>
          <!-- Form Body -->
          <form
            class="mt-6 flex flex-col flex-1 justify-between space-y-4"
            onsubmit="event.preventDefault()"
          >
            <div class="space-y-3.5">
              <!-- Nombre de la ruta -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-name"
                  >Nombre de la ruta</label
                >
                <input
                  class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
                  id="route-name"
                  placeholder=""
                  type="text"
                />
              </div>
              <!-- Barrio -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-neighborhood"
                  >Barrio</label
                >
                <input
                  class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
                  id="route-neighborhood"
                  placeholder=""
                  type="text"
                />
              </div>
              <!-- Hora de inicio -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-start-time"
                  >Hora de inicio</label
                >
                <input
                  class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
                  id="route-start-time"
                  placeholder=""
                  type="text"
                />
              </div>
              <!-- Hora de finalización -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-end-time"
                  >Hora de finalización</label
                >
                <input
                  class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
                  id="route-end-time"
                  placeholder=""
                  type="text"
                />
              </div>
              <!-- Destino -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-destination"
                  >Destino</label
                >
                <input
                  class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
                  id="route-destination"
                  placeholder=""
                  type="text"
                />
              </div>
              <!-- Sector -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-sector"
                  >Sector</label
                >
                <input
                  class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
                  id="route-sector"
                  placeholder=""
                  type="text"
                />
              </div>
              <!-- Bus (Select) -->
              <div>
                <label
                  class="block text-sm font-semibold text-slate-500 mb-1.5"
                  for="route-bus"
                  >Bus</label
                >
                <div class="relative">
                  <select
                    class="w-full h-11 px-4 bg-inputBg border border-slate-200 rounded-xl text-slate-800 text-sm appearance-none focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition pr-10 cursor-pointer"
                    id="route-bus"
                  >
                    <option disabled="" selected="" value=""></option>
                    <option value="bus1">Bus 01 - Placa ABC-123</option>
                    <option value="bus2">Bus 02 - Placa DEF-456</option>
                    <option value="bus3">Bus 03 - Placa GHI-789</option>
                  </select>
                  <div
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewbox="0 0 24 24"
                    >
                      <path
                        d="M19 9l-7 7-7-7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      ></path>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
            <!-- Submit Button -->
            <div class="pt-4">
              <button
                class="w-full h-12 bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-medium text-base rounded-xl transition duration-150 ease-in-out shadow-sm flex items-center justify-center"
                type="submit"
              >
                Registrar
              </button>
            </div>
          </form>
        </section>
        <!-- END: Card Registrar Rutas -->
        <!-- BEGIN: Card Estudiantes Registrados -->
        <section
          class="w-1/2 bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col p-8 h-full"
          data-purpose="registered-students-card"
        >
          <!-- Header: Title & Counter -->
          <div class="text-center pb-5 border-b border-slate-200/80">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">
              Estudiantes registrados
            </h2>
            <div class="mt-2">
              <span
                class="text-4xl font-extrabold text-brand-600 tracking-tight"
                >4</span
              >
            </div>
          </div>
          <!-- Search Input -->
          <div class="mt-6 relative">
            <input
              class="w-full h-10 pl-4 pr-10 bg-inputBg border border-slate-200 rounded-lg text-sm text-slate-700 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition"
              placeholder="Buscar..."
              type="text"
            />
            <div
              class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewbox="0 0 24 24"
              >
                <path
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.2"
                ></path>
              </svg>
            </div>
          </div>
          <!-- List Section -->
          <div class="mt-6 flex-1 overflow-y-auto space-y-3">
            <!-- Route Item Card: Ruta Centro - Sur -->
            <article
              class="p-4 rounded-xl border border-slate-200/90 bg-slate-50/40 hover:bg-slate-50 transition-colors flex items-start justify-between relative group"
            >
              <div class="flex items-start gap-4">
                <!-- Route Marker Icon -->
                <div
                  class="w-10 h-10 rounded-lg bg-blue-50 text-brand-600 flex items-center justify-center flex-shrink-0 mt-0.5"
                >
                  <svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
                    <path
                      d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                    ></path>
                  </svg>
                </div>
                <!-- Route Details -->
                <div>
                  <h3 class="text-sm font-bold text-slate-900 leading-tight">
                    Ruta Centro - Sur
                  </h3>
                  <p class="text-xs text-slate-500 mt-1 font-medium">
                    Colegio Principal
                  </p>
                  <!-- Schedules -->
                  <div
                    class="flex items-center gap-12 mt-3 text-xs font-semibold text-slate-700"
                  >
                    <span>6:30</span>
                    <span>9:00</span>
                  </div>
                </div>
              </div>
              <!-- Action Controls (Delete, View, Edit) -->
              <div class="flex items-center gap-2.5 text-slate-700">
                <!-- Delete -->
                <button
                  class="p-1 hover:text-red-600 transition-colors"
                  title="Eliminar"
                  type="button"
                >
                  <svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
                    <path
                      d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
                    ></path>
                  </svg>
                </button>
                <!-- View -->
                <button
                  class="p-1 hover:text-brand-600 transition-colors"
                  title="Ver detalles"
                  type="button"
                >
                  <svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
                    <path
                      d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                    ></path>
                  </svg>
                </button>
                <!-- Edit -->
                <button
                  class="p-1 hover:text-brand-600 transition-colors"
                  title="Editar"
                  type="button"
                >
                  <svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
                    <path
                      d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                    ></path>
                  </svg>
                </button>
              </div>
            </article>
          </div>
        </section>
        <!-- END: Card Estudiantes Registrados -->
      </main>
      <!-- END: Workspace Container -->
    </div>
    <!-- END: Main App Container -->
  </body>
</html>
