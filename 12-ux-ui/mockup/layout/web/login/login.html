<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guardian Escolar - Iniciar Sesión</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9ebff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#0f172a',
            },
            canvas: '#edf3f9',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom Style Tag for fine-tuning shadows and inputs -->
<style data-purpose="custom-enhancements">
    .card-shadow {
      box-shadow: 0 20px 45px -10px rgba(30, 58, 138, 0.12), 0 10px 20px -8px rgba(0, 0, 0, 0.04);
    }
    input::placeholder {
      color: #9ca3af;
      font-size: 0.875rem;
    }
  </style>
</head>
<body class="bg-canvas min-h-screen flex flex-col font-sans antialiased text-slate-800 selection:bg-brand-500 selection:text-white">
<!-- BEGIN: TopHeader -->
<header class="w-full px-6 lg:px-8 py-5 flex items-center relative" data-purpose="application-header">
<!-- Left Logo Icon -->
<div class="flex items-center">
<a aria-label="Inicio Guardian Escolar" class="inline-flex items-center text-brand-600 hover:opacity-90 transition-opacity" href="#">
<!-- Shield Icon Filled with inner cutout styling -->
<svg class="w-9 h-9" fill="currentColor" viewbox="0 0 36 36">
<rect fill="#2563eb" height="36" rx="9" width="36"></rect>
<path d="M18 9C18 9 24.5 10.5 25 14.5C25.5 18.5 22.5 24.5 18 27C13.5 24.5 10.5 18.5 11 14.5C11.5 10.5 18 9 18 9Z" fill="#ffffff"></path>
</svg>
</a>
</div>
<!-- Centered Brand Title -->
<div class="absolute inset-x-0 mx-auto text-center pointer-events-none">
<h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900 pointer-events-auto inline-block">
        Guardian Escolar
      </h1>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8" data-purpose="main-authentication-area">
<!-- Login Card Container -->
<div class="w-full max-w-[850px] bg-white rounded-2xl overflow-hidden card-shadow flex flex-col md:flex-row border border-slate-100 transition-all">
<!-- BEGIN: LeftInfoPanel -->
<section class="w-full md:w-[42%] bg-gradient-to-b from-[#225de0] to-[#1e50c4] p-8 md:p-10 flex flex-col justify-between text-white relative min-h-[300px] md:min-h-[510px]" data-purpose="welcome-branding-panel">
<!-- Top branding elements -->
<div>
<!-- Shield Icon inside slightly translucid badge -->
<div class="w-13 h-13 mb-8 inline-block">
<div class="w-12 h-12 rounded-xl bg-blue-500/50 flex items-center justify-center shadow-inner">
<svg class="w-6 h-6 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L4 5V11.09C4 16.14 7.41 20.85 12 22C16.59 20.85 20 16.14 20 11.09V5L12 2Z"></path>
</svg>
</div>
</div>
<!-- Welcome Headline -->
<h2 class="text-2xl md:text-3xl font-bold leading-tight tracking-tight mb-3">
            Bienvenido de<br class="hidden sm:inline"/> nuevo
          </h2>
<!-- Descriptive subtext -->
<p class="text-blue-100 text-sm md:text-[0.95rem] leading-relaxed max-w-xs font-normal opacity-95">
            Accede al sistema completo de monitoreo de rutas escolares.
          </p>
</div>
<!-- Bottom Support Information -->
<footer class="pt-6 md:pt-0">
<p class="text-xs text-blue-200/90 font-light tracking-wide">
            guardian.edu · Soporte 24/7
          </p>
</footer>
</section>
<!-- END: LeftInfoPanel -->
<!-- BEGIN: RightLoginForm -->
<section class="w-full md:w-[58%] p-8 sm:p-10 lg:p-12 flex flex-col justify-center bg-white" data-purpose="login-form-panel">
<!-- Form Header -->
<header class="mb-7">
<h2 class="text-2xl font-bold text-slate-900 tracking-tight">
            Iniciar sesión
          </h2>
<p class="text-sm text-slate-500 mt-1.5 font-normal">
            Ingresa tus credenciales para acceder al panel
          </p>
</header>
<!-- Authentication Form -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div data-purpose="email-field-group">
<label class="block text-sm font-medium text-slate-800 mb-1.5" for="email">
              Correo electrónico
            </label>
<input class="w-full px-3.5 py-2.5 rounded-md border border-slate-300 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors shadow-sm" id="email" name="email" placeholder="tu-usuario@email.com" required="" type="email"/>
</div>
<!-- Password Input Field -->
<div data-purpose="password-field-group">
<label class="block text-sm font-medium text-slate-800 mb-1.5" for="password">
              Contraseña
            </label>
<input class="w-full px-3.5 py-2.5 rounded-md border border-slate-300 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-brand-600 transition-colors shadow-sm" id="password" name="password" placeholder="Ingresa tu contraseña" required="" type="password"/>
<!-- Forgot Password Link -->
<div class="mt-2 text-right">
<a class="text-xs text-brand-600 hover:text-brand-700 font-normal hover:underline transition-all" href="#">
                ¿Olvidaste tu contraseña?
              </a>
</div>
</div>
<!-- Submit Action Button -->
<div class="pt-3 pb-2 flex justify-center" data-purpose="action-buttons">
<button class="px-8 py-2.5 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-medium text-sm rounded-full shadow-md hover:shadow transition-all duration-150 ease-in-out cursor-pointer min-w-[150px] text-center" type="submit">
              Iniciar sesión
            </button>
</div>
<!-- Divider Line -->
<div class="pt-4">
<hr class="border-t border-slate-200 w-full"/>
</div>
<!-- Legal & Terms Footer -->
<div class="pt-3 text-center">
<p class="text-xs text-slate-600 leading-relaxed max-w-xs mx-auto">
              Al ingresar aceptas nuestros 
              <a class="text-brand-600 hover:underline" href="#">Términos de uso</a> 
              y 
              <a class="text-brand-600 hover:underline" href="#">Política de privacidad</a>
</p>
</div>
</form>
</section>
<!-- END: RightLoginForm -->
</div>
</main>
<!-- END: MainContent -->
</body></html>
