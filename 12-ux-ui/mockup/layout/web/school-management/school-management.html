<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Guardian Escolar</title>
    <!-- Tailwind CSS v3 with forms and container-queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eef4fc",
                500: "#2563eb",
                600: "#1d4ed8",
                700: "#1e40af",
                activeNav: "#3b82f6",
                sidebar: "#1d4ed8",
                topbar: "#1e4fd8",
              },
            },
          },
        },
      };
    </script>
    <!-- BEGIN: Custom Styles -->
    <style data-purpose="custom-scroll-and-inputs">
      /* Subtle custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Style file input button native styling to match image */
      input[type="file"]::file-selector-button {
        border: 1px solid #cbd5e1;
        background-color: #f1f5f9;
        padding: 0.35rem 0.75rem;
        border-radius: 0.375rem;
        font-size: 0.8125rem;
        color: #1e293b;
        cursor: pointer;
        margin-right: 0.75rem;
        transition: background-color 0.15s ease-in-out;
      }
      input[type="file"]::file-selector-button:hover {
        background-color: #e2e8f0;
      }
    </style>
    <!-- END: Custom Styles -->
  </head>
  <body
    class="bg-[#ebf2fb] min-h-screen flex flex-col font-sans antialiased text-slate-800"
  >
    <!-- BEGIN: TopBar -->
    <header
      class="bg-[#1e4fd8] h-14 w-full flex items-center justify-between px-5 text-white shadow-sm shrink-0 z-20"
    >
      <!-- Back arrow button -->
      <button
        aria-label="Volver"
        class="p-1.5 rounded-full hover:bg-white/10 transition-colors focus:outline-none"
        type="button"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          viewBox="0 0 24 24"
        >
          <path
            d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>
      <!-- Center header title -->
      <h1 class="text-lg font-medium tracking-wide text-white">
        Guardian Escolar
      </h1>
      <!-- Spacer for balance -->
      <div class="w-8"></div>
    </header>
    <!-- END: TopBar -->
    <div class="flex flex-1 overflow-hidden">
      <!-- BEGIN: Sidebar -->
      <aside
        class="w-64 bg-[#1e4fd8] flex flex-col justify-between pt-6 pb-5 px-3 shrink-0 select-none text-white z-10"
      >
        <div class="space-y-4">
          <!-- Section label -->
          <span
            class="px-4 text-[11px] font-semibold tracking-wider text-blue-200 uppercase block"
            >ADMINISTRAR</span
          >
          <!-- Nav items list -->
          <nav aria-label="Menú de administración" class="space-y-1.5">
            <!-- Item: Administradores -->
            <a
              class="flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-white/80 hover:bg-white/10 hover:text-white transition-colors text-sm font-medium"
              href="#"
            >
              <svg
                class="w-5 h-5 shrink-0 opacity-90"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
              >
                <path
                  d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span class="">Administradores</span>
            </a>
            <!-- Item: Escuelas (Active) -->
            <a
              class="flex items-center gap-3.5 px-4 py-2.5 rounded-lg bg-[#2e62ec] text-white shadow-sm font-medium text-sm transition-colors"
              href="#"
            >
              <svg
                class="w-5 h-5 shrink-0"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-5.25 6.557q.049.638.14 1.27m0 0a3.75 3.75 0 003.11 3.11"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span class="">Escuelas</span>
            </a>
          </nav>
        </div>
        <!-- Bottom Profile Link -->
        <div class="pt-4 border-t border-white/20">
          <a
            class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-white/15 text-white shadow-sm font-medium text-sm transition-all hover:bg-white/20"
            href="#"
          >
            <svg
              class="w-5 h-5 shrink-0 text-white"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"
              ></path>
            </svg>
            <span class="">Perfil</span>
          </a>
        </div>
      </aside>
      <!-- END: Sidebar -->
      <!-- BEGIN: MainContent -->
      <main class="flex-1 p-6 md:p-8 overflow-y-auto bg-[#ebf2fb]">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-7">
          <!-- BEGIN: LeftCard - School Registration Form -->
          <section
            class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8"
            data-purpose="registration-card"
          >
            <!-- Card Title & Divider -->
            <div class="text-center pb-4 mb-5 border-b border-slate-200">
              <h2
                class="text-[1.25rem] font-bold text-slate-800 tracking-tight"
              >
                Registrar escuela
              </h2>
            </div>
            <!-- Registration Form -->
            <form class="space-y-4" onsubmit="event.preventDefault()">
              <!-- School Name Input -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-name"
                  >Nombre de la escuela</label
                >
                <input
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-name"
                  name="school-name"
                  type="text"
                />
              </div>
              <!-- Logo File Input -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-logo"
                  >Logo</label
                >
                <div
                  class="relative border border-slate-200 bg-[#f8fafc] rounded-md px-3 py-1.5 flex items-center"
                >
                  <input
                    class="w-full text-xs text-slate-500 file:cursor-pointer"
                    id="school-logo"
                    name="school-logo"
                    type="file"
                  />
                </div>
              </div>
              <!-- City Dropdown -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-city"
                  >Ciudad</label
                >
                <select
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-city"
                  name="school-city"
                >
                  <option disabled="" selected="" value=""></option>
                  <option value="neiva">Neiva</option>
                  <option value="bogota">Bogotá</option>
                  <option value="medellin">Medellín</option>
                  <option value="cali">Cali</option>
                </select>
              </div>
              <!-- Address Input -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-address"
                  >Dirección</label
                >
                <input
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-address"
                  name="school-address"
                  type="text"
                />
              </div>
              <!-- Phone Input -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-phone"
                  >Teléfono</label
                >
                <input
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-phone"
                  name="school-phone"
                  type="tel"
                />
              </div>
              <!-- Educational Level Dropdown -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-level"
                  >Nivel educativo</label
                >
                <select
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-level"
                  name="school-level"
                >
                  <option disabled="" selected="" value=""></option>
                  <option value="primaria">Primaria</option>
                  <option value="secundaria">Secundaria</option>
                  <option value="media">Educación Media</option>
                  <option value="integral">Integral (Todos los niveles)</option>
                </select>
              </div>
              <!-- Email Input -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-email"
                  >Correo electrónico</label
                >
                <input
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-email"
                  name="school-email"
                  type="email"
                />
              </div>
              <!-- Website Input -->
              <div>
                <label
                  class="block text-xs font-semibold text-slate-600 mb-1"
                  for="school-website"
                  >Página web</label
                >
                <input
                  class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  id="school-website"
                  name="school-website"
                  type="url"
                />
              </div>
              <!-- Submit Button -->
              <div class="pt-2">
                <button
                  class="w-full bg-[#1e4fd8] hover:bg-[#1942be] text-white font-medium py-2.5 rounded-lg shadow-sm transition-all duration-150 focus:ring-2 focus:ring-blue-400 focus:outline-none text-sm tracking-wide"
                  type="submit"
                >
                  Registrar
                </button>
              </div>
            </form>
          </section>
          <!-- END: LeftCard -->
          <!-- BEGIN: RightCard - Registered Schools List -->
          <section
            class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8"
            data-purpose="schools-list-card"
          >
            <!-- Card Header & Total Counter -->
            <div class="text-center mb-6">
              <h2
                class="text-[1.25rem] font-bold text-slate-800 tracking-tight mb-1"
              >
                Escuelas registradas
              </h2>
              <p class="text-3xl font-bold text-[#1e4fd8]">2</p>
            </div>
            <!-- Search Bar -->
            <div class="relative mb-5">
              <input
                class="w-full bg-[#f8fafc] border border-slate-200 rounded-md py-2 pl-3.5 pr-10 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                placeholder="Buscar..."
                type="text"
              />
              <div
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </div>
            </div>
            <!-- Schools List Container -->
            <div class="space-y-3.5" data-purpose="school-items-container">
              <!-- School Item 1 -->
              <article
                class="flex items-center justify-between p-4 border border-slate-200 rounded-lg bg-white hover:bg-slate-50/50 transition-colors"
              >
                <div class="flex items-center gap-3.5">
                  <!-- Cap Icon -->
                  <div class="text-[#1e4fd8] shrink-0">
                    <svg
                      class="w-6 h-6"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z"
                      ></path>
                    </svg>
                  </div>
                  <!-- Info -->
                  <div>
                    <h3 class="text-sm font-bold text-slate-800 leading-snug">
                      Colegio Técnico Neiva
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5">Calle 50 #20-30</p>
                  </div>
                </div>
                <!-- Action Buttons -->
                <div class="flex items-center gap-2.5 text-slate-700">
                  <!-- Delete Button -->
                  <button
                    aria-label="Eliminar escuela"
                    class="p-1 rounded hover:text-red-600 transition-colors focus:outline-none"
                    title="Eliminar"
                    type="button"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M9 3V4H4V6H5V19C5 20.1 5.9 21 7 21H17C18.1 21 19 20.1 19 19V6H20V4H15V3H9M7 6H17V19H7V6M9 8V17H11V8H9M13 8V17H15V8H13Z"
                      ></path>
                    </svg>
                  </button>
                  <!-- View Button -->
                  <button
                    aria-label="Ver detalles"
                    class="p-1 rounded hover:text-[#1e4fd8] transition-colors focus:outline-none"
                    title="Ver detalles"
                    type="button"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z"
                      ></path>
                    </svg>
                  </button>
                  <!-- Edit Button -->
                  <button
                    aria-label="Editar escuela"
                    class="p-1 rounded hover:text-[#1e4fd8] transition-colors focus:outline-none"
                    title="Editar"
                    type="button"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M20.71 7.04C21.1 6.65 21.1 6 20.71 5.63L18.37 3.29C18 2.9 17.35 2.9 16.96 3.29L15.13 5.12L18.88 8.87M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25Z"
                      ></path>
                    </svg>
                  </button>
                </div>
              </article>
              <!-- School Item 2 -->
              <article
                class="flex items-center justify-between p-4 border border-slate-200 rounded-lg bg-white hover:bg-slate-50/50 transition-colors"
              >
                <div class="flex items-center gap-3.5">
                  <!-- Cap Icon -->
                  <div class="text-[#1e4fd8] shrink-0">
                    <svg
                      class="w-6 h-6"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z"
                      ></path>
                    </svg>
                  </div>
                  <!-- Info -->
                  <div>
                    <h3 class="text-sm font-bold text-slate-800 leading-snug">
                      Instituto Educativo San Jorge
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5">
                      Carrera 5 #10-50
                    </p>
                  </div>
                </div>
                <!-- Action Buttons -->
                <div class="flex items-center gap-2.5 text-slate-700">
                  <!-- Delete Button -->
                  <button
                    aria-label="Eliminar escuela"
                    class="p-1 rounded hover:text-red-600 transition-colors focus:outline-none"
                    title="Eliminar"
                    type="button"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M9 3V4H4V6H5V19C5 20.1 5.9 21 7 21H17C18.1 21 19 20.1 19 19V6H20V4H15V3H9M7 6H17V19H7V6M9 8V17H11V8H9M13 8V17H15V8H13Z"
                      ></path>
                    </svg>
                  </button>
                  <!-- View Button -->
                  <button
                    aria-label="Ver detalles"
                    class="p-1 rounded hover:text-[#1e4fd8] transition-colors focus:outline-none"
                    title="Ver detalles"
                    type="button"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z"
                      ></path>
                    </svg>
                  </button>
                  <!-- Edit Button -->
                  <button
                    aria-label="Editar escuela"
                    class="p-1 rounded hover:text-[#1e4fd8] transition-colors focus:outline-none"
                    title="Editar"
                    type="button"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M20.71 7.04C21.1 6.65 21.1 6 20.71 5.63L18.37 3.29C18 2.9 17.35 2.9 16.96 3.29L15.13 5.12L18.88 8.87M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25Z"
                      ></path>
                    </svg>
                  </button>
                </div>
              </article>
            </div>
          </section>
          <!-- END: RightCard -->
        </div>
      </main>
      <!-- END: MainContent -->
    </div>
  </body>
</html>
