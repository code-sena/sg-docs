<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Información de la Parada</title>
    <!-- Tailwind CSS CDN with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style data-purpose="typography">
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-100/70 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800"
  >
    <!-- BEGIN: ModalContainer -->
    <main
      class="w-full max-w-[490px] bg-white rounded-2xl shadow-sm border border-slate-100 px-8 py-8 md:px-10 md:py-10"
      data-purpose="stop-information-modal"
    >
      <!-- BEGIN: ModalHeader -->
      <header class="text-center">
        <!-- Main Modal Title -->
        <h1 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">
          Información de la Parada
        </h1>
        <!-- Location Pin Avatar -->
        <div class="mt-6 flex justify-center">
          <div
            class="w-20 h-20 rounded-full bg-[#EBF3FE] flex items-center justify-center"
          >
            <svg
              aria-hidden="true"
              class="w-8 h-8 text-[#1D4ED8]"
              fill="currentColor"
              viewbox="0 0 24 24"
            >
              <path
                clip-rule="evenodd"
                d="M11.54 22.351A24.25 24.25 0 014 10.5C4 6.358 7.358 3 11.5 3s7.5 3.358 7.5 7.5c0 4.673-3.084 9.176-7.46 11.851zm0-8.851a3 3 0 100-6 3 3 0 000 6z"
                fill-rule="evenodd"
              ></path>
            </svg>
          </div>
        </div>
        <!-- Stop Name & Subtitle -->
        <div class="mt-4">
          <h2 class="text-lg font-bold text-slate-900">Parada Centro</h2>
          <p class="text-sm text-slate-500 mt-1 font-normal">
            Información de la Parada
          </p>
        </div>
      </header>
      <!-- END: ModalHeader -->
      <!-- Top Divider -->
      <hr class="border-t border-slate-100 my-6" />
      <!-- BEGIN: DetailsList -->
      <section class="space-y-4" data-purpose="stop-details">
        <!-- Field: Nombre -->
        <div class="space-y-0.5">
          <span class="block text-sm font-semibold text-slate-900">Nombre</span>
          <span class="block text-[15px] text-slate-500 font-normal"
            >Parada Centro</span
          >
        </div>
        <!-- Field: Estudiante -->
        <div class="space-y-0.5">
          <span class="block text-sm font-semibold text-slate-900"
            >Estudiante</span
          >
          <span class="block text-[15px] text-slate-500 font-normal"
            >Juan Carlos García</span
          >
        </div>
        <!-- Field: Ciudad -->
        <div class="space-y-0.5">
          <span class="block text-sm font-semibold text-slate-900">Ciudad</span>
          <span class="block text-[15px] text-slate-500 font-normal"
            >Neiva</span
          >
        </div>
        <!-- Field: Dirección -->
        <div class="space-y-0.5">
          <span class="block text-sm font-semibold text-slate-900"
            >Dirección</span
          >
          <span class="block text-[15px] text-slate-500 font-normal"
            >Carrera 7 #5-40</span
          >
        </div>
        <!-- Field: Latitud -->
        <div class="space-y-0.5">
          <span class="block text-sm font-semibold text-slate-900"
            >Latitud</span
          >
          <span class="block text-[15px] text-slate-500 font-normal"
            >2.9277</span
          >
        </div>
        <!-- Field: Longitud -->
        <div class="space-y-0.5">
          <span class="block text-sm font-semibold text-slate-900"
            >Longitud</span
          >
          <span class="block text-[15px] text-slate-500 font-normal"
            >-75.2892</span
          >
        </div>
      </section>
      <!-- END: DetailsList -->
      <!-- Bottom Divider -->
      <hr class="border-t border-slate-100 my-6" />
      <!-- BEGIN: ModalActions -->
      <footer class="flex justify-center">
        <button
          class="w-36 py-2.5 px-6 rounded-xl bg-[#2160DE] hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm transition-colors duration-150 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          data-purpose="close-button"
          type="button"
        >
          Cerrar
        </button>
      </footer>
      <!-- END: ModalActions -->
    </main>
    <!-- END: ModalContainer -->
  </body>
</html>
