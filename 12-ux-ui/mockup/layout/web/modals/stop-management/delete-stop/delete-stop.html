<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Eliminar Parada - Guardian Escolar</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS CDN v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
            },
            colors: {
              brand: {
                blue: "#1d59e8",
                "blue-hover": "#174bcc",
                circle: "#eef4fc",
                dark: "#1e293b",
              },
            },
          },
        },
      };
    </script>
    <style data-purpose="custom-typography">
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-100 selection:text-blue-900"
  >
    <!-- BEGIN: DeleteConfirmationModal -->
    <main
      class="w-full max-w-[390px] bg-white rounded-3xl p-8 sm:p-9 shadow-sm border border-slate-100 flex flex-col items-center text-center transition-all duration-200"
      data-purpose="modal-container"
    >
      <!-- BEGIN: HeaderSection -->
      <header class="w-full">
        <!-- Title -->
        <h1 class="text-[23px] font-bold tracking-tight text-[#1a2332]">
          Eliminar Parada
        </h1>
        <!-- Warning description text -->
        <p
          class="mt-2.5 text-[15px] leading-snug text-slate-600 font-normal max-w-[280px] mx-auto"
        >
          ¿Deseas eliminar esta parada? Esta acción no se puede deshacer.
        </p>
      </header>
      <!-- END: HeaderSection -->
      <!-- BEGIN: TargetItemDetails -->
      <section
        aria-label="Detalles del elemento a eliminar"
        class="my-7 flex flex-col items-center"
      >
        <!-- Circular icon container with soft pastel blue background -->
        <div
          class="w-[94px] h-[94px] rounded-full bg-[#ecf3fc] flex items-center justify-center shadow-inner"
          data-purpose="icon-badge"
        >
          <!-- Location pin icon -->
          <svg
            aria-hidden="true"
            class="w-8 h-8 text-[#1a2332]"
            fill="currentColor"
            viewbox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              clip-rule="evenodd"
              d="M11.54 22.351A.75.75 0 0112 22.5c.214 0 .42-.09.56-.25.59-.696 1.76-2.072 2.872-3.67 2.083-2.99 3.818-6.19 3.818-8.83 0-4.557-3.693-8.25-8.25-8.25s-8.25 3.693-8.25 8.25c0 2.64 1.735 5.84 3.818 8.83 1.112 1.598 2.282 2.974 2.872 3.67.14.16.346.25.56.25zm.46-13.101a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z"
              fill-rule="evenodd"
            ></path>
          </svg>
        </div>
        <!-- Stop Name / Parada Centro -->
        <h2 class="mt-4 text-[21px] font-bold tracking-tight text-[#1a2332]">
          Parada Centro
        </h2>
      </section>
      <!-- END: TargetItemDetails -->
      <!-- BEGIN: ActionButtons -->
      <footer class="w-full flex items-center gap-3.5 mt-1">
        <!-- Cancel Button -->
        <button
          class="flex-1 py-3 px-4 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-600 font-medium text-[15px] rounded-2xl border border-slate-200 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-1 shadow-sm"
          data-purpose="cancel-action"
          type="button"
        >
          Cancelar
        </button>
        <!-- Confirm Delete Button -->
        <button
          class="flex-1 py-3 px-4 bg-[#1d59e8] hover:bg-[#184cc8] active:bg-[#1440a8] text-white font-medium text-[15px] rounded-2xl transition-colors duration-150 shadow-sm shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-1"
          data-purpose="confirm-delete-action"
          type="button"
        >
          Eliminar
        </button>
      </footer>
      <!-- END: ActionButtons -->
    </main>
    <!-- END: DeleteConfirmationModal -->
    <!-- JavaScript for basic interaction simulation -->
    <script data-purpose="interaction-handlers">
      document.addEventListener("DOMContentLoaded", () => {
        const cancelButton = document.querySelector(
          '[data-purpose="cancel-action"]',
        );
        const deleteButton = document.querySelector(
          '[data-purpose="confirm-delete-action"]',
        );

        if (cancelButton) {
          cancelButton.addEventListener("click", () => {
            console.log("Operación cancelada");
          });
        }

        if (deleteButton) {
          deleteButton.addEventListener("click", () => {
            console.log("Parada eliminada exitosamente");
          });
        }
      });
    </script>
  </body>
</html>
