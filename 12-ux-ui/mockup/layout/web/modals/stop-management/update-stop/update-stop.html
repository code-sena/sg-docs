<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Actualizar parada</title>
    <!-- Load Tailwind CSS v3 with forms plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: "#223249",
                navyHover: "#182436",
                softBlue: "#edf3fa",
                inputBg: "#fafcff",
                cancelBg: "#eceef0",
                cancelHover: "#e2e5e8",
              },
            },
          },
        },
      };
    </script>
    <style data-purpose="custom-elements">
      /* Subtle custom styling to match form controls precisely */
      .custom-select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2364748b'%3e%3cpath fill-rule='evenodd' d='M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z' clip-rule='evenodd'/%3e%3c/svg%3e");
        background-position: right 0.75rem center;
        background-repeat: no-repeat;
        background-size: 1.15em 1.15em;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800 selection:bg-blue-100"
  >
    <!-- BEGIN: ModalContainer -->
    <main
      class="w-full max-w-[530px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden"
      data-purpose="update-stop-modal"
    >
      <!-- BEGIN: HeaderSection -->
      <header class="pt-6 pb-4">
        <!-- Modal Main Title -->
        <h1 class="text-center text-xl font-bold text-slate-900 tracking-tight">
          Actualizar parada
        </h1>
        <!-- Top horizontal separator -->
        <div class="mt-4 mx-7 border-b border-slate-100"></div>
        <!-- Icon & Stop Name Header -->
        <div class="pt-6 pb-2 flex flex-col items-center justify-center">
          <!-- Location Pin Circular Avatar -->
          <div
            aria-hidden="true"
            class="w-16 h-16 rounded-full bg-[#edf2fa] flex items-center justify-center mb-3 text-[#202f45]"
          >
            <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
              <path
                clip-rule="evenodd"
                d="M12 2C7.58172 2 4 5.58172 4 10C4 15.25 12 22 12 22C12 22 20 15.25 20 10C20 5.58172 16.4183 2 12 2ZM12 13C13.6569 13 15 11.6569 15 10C15 8.34315 13.6569 7 12 7C10.3431 7 9 8.34315 9 10C9 11.6569 10.3431 13 12 13Z"
                fill-rule="evenodd"
              ></path>
            </svg>
          </div>
          <!-- Subtitle Stop Label -->
          <h2 class="text-[17px] font-bold text-slate-900">Parada Centro</h2>
        </div>
        <!-- Bottom horizontal separator -->
        <div class="mt-4 mx-7 border-b border-slate-100"></div>
      </header>
      <!-- END: HeaderSection -->
      <!-- BEGIN: FormContent -->
      <form
        class="px-7 pt-2 pb-6 space-y-4"
        data-purpose="update-stop-form"
        onsubmit="event.preventDefault()"
      >
        <!-- Field: Nombre -->
        <div>
          <label
            class="block text-[13px] font-medium text-slate-700 mb-1.5"
            for="stop-name"
          >
            Nombre
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#fafcff] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-400 focus:outline-none focus:ring-0 transition-colors"
            id="stop-name"
            name="name"
            type="text"
            value="Parada Centro"
          />
        </div>
        <!-- Field: Estudiante -->
        <div>
          <label
            class="block text-[13px] font-medium text-slate-700 mb-1.5"
            for="stop-student"
          >
            Estudiante
          </label>
          <div class="relative">
            <select
              class="custom-select appearance-none w-full rounded-lg border border-slate-200 bg-[#fafcff] px-3.5 py-2.5 text-sm text-slate-800 pr-9 focus:bg-white focus:border-slate-400 focus:outline-none focus:ring-0 cursor-pointer transition-colors"
              id="stop-student"
              name="student"
            >
              <option disabled="" selected="" value=""></option>
            </select>
          </div>
        </div>
        <!-- Field: Ciudad -->
        <div>
          <label
            class="block text-[13px] font-medium text-slate-700 mb-1.5"
            for="stop-city"
          >
            Ciudad
          </label>
          <div class="relative">
            <select
              class="custom-select appearance-none w-full rounded-lg border border-slate-200 bg-[#fafcff] px-3.5 py-2.5 text-sm text-slate-800 pr-9 focus:bg-white focus:border-slate-400 focus:outline-none focus:ring-0 cursor-pointer transition-colors"
              id="stop-city"
              name="city"
            >
              <option disabled="" selected="" value=""></option>
            </select>
          </div>
        </div>
        <!-- Field: Dirección -->
        <div>
          <label
            class="block text-[13px] font-medium text-slate-700 mb-1.5"
            for="stop-address"
          >
            Dirección
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#fafcff] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-400 focus:outline-none focus:ring-0 transition-colors"
            id="stop-address"
            name="address"
            type="text"
            value="Carrera 7 #5-40"
          />
        </div>
        <!-- Field: Latitud -->
        <div>
          <label
            class="block text-[13px] font-medium text-slate-700 mb-1.5"
            for="stop-latitude"
          >
            Latitud
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#fafcff] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-400 focus:outline-none focus:ring-0 transition-colors"
            id="stop-latitude"
            name="latitude"
            type="text"
            value="2.9277"
          />
        </div>
        <!-- Field: Longitud -->
        <div>
          <label
            class="block text-[13px] font-medium text-slate-700 mb-1.5"
            for="stop-longitude"
          >
            Longitud
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#fafcff] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-slate-400 focus:outline-none focus:ring-0 transition-colors"
            id="stop-longitude"
            name="longitude"
            type="text"
            value="-75.2892"
          />
        </div>
        <!-- Divider above action buttons -->
        <div class="pt-1.5 pb-1">
          <div class="border-b border-slate-100 w-full"></div>
        </div>
        <!-- Action Buttons -->
        <footer class="pt-1 flex items-center gap-4">
          <!-- Cancel Button -->
          <button
            class="w-1/2 py-2.5 px-4 rounded-lg bg-brand-cancelBg text-[15px] font-medium text-slate-800 hover:bg-brand-cancelHover active:scale-[0.99] transition-all text-center"
            type="button"
          >
            Cancelar
          </button>
          <!-- Save Changes Button -->
          <button
            class="w-1/2 py-2.5 px-4 rounded-lg bg-brand-navy text-[15px] font-medium text-white hover:bg-brand-navyHover active:scale-[0.99] shadow-sm transition-all text-center"
            type="submit"
          >
            Guardar cambios
          </button>
        </footer>
      </form>
      <!-- END: FormContent -->
    </main>
    <!-- END: ModalContainer -->
  </body>
</html>
