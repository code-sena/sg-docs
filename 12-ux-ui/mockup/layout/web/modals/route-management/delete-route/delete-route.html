<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Eliminar Ruta - Guardian Escolar</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: "#0f172a",
                textMuted: "#334155",
                subtleBg: "#e9f1fd",
                blueBtn: "#1e5ede",
                cancelBorder: "#dbe3ed",
                cancelText: "#62748e",
              },
            },
            fontFamily: {
              sans: [
                "Inter",
                "system-ui",
                "-apple-system",
                "BlinkMacSystemFont",
                "Segoe UI",
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style data-purpose="base-typography">
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[#f1f5f9] flex items-center justify-center p-4 antialiased text-slate-800 selection:bg-blue-100"
  >
    <!-- BEGIN: ModalContainer -->
    <div
      class="fixed inset-0 bg-slate-900/20 backdrop-blur-[2px] flex items-center justify-center p-4 z-50"
      data-purpose="modal-overlay"
    >
      <!-- BEGIN: ConfirmationCard -->
      <div
        aria-describedby="modal-description"
        aria-labelledby="modal-title"
        aria-modal="true"
        class="bg-white w-full max-w-[384px] rounded-2xl shadow-xl border border-slate-100/80 px-7 py-7 flex flex-col items-center text-center"
        data-purpose="confirmation-modal-dialog"
        role="dialog"
      >
        <!-- BEGIN: ModalHeader -->
        <header class="w-full flex flex-col items-center">
          <!-- Title -->
          <h2
            class="text-[21px] font-bold tracking-tight text-[#0f172a] mb-2"
            id="modal-title"
          >
            Eliminar Ruta
          </h2>
          <!-- Description / Warning text -->
          <p
            class="text-[14px] leading-[1.38] text-[#334155] max-w-[280px]"
            id="modal-description"
          >
            ¿Deseas eliminar esta ruta? Esta acción no se puede deshacer.
          </p>
        </header>
        <!-- END: ModalHeader -->
        <!-- BEGIN: RouteVisualIdentification -->
        <section
          aria-label="Información de la ruta seleccionada"
          class="flex flex-col items-center my-6"
        >
          <!-- Circular Icon Badge with subtle border & background -->
          <div class="flex justify-center" data-purpose="route-badge">
            <div
              class="w-20 h-20 rounded-full bg-[#f0f7ff] flex items-center justify-center"
            >
              <!-- Route pathway icon with two terminal endpoints matching reference -->
              <svg
                class="w-10 h-10 text-[#243c5a]"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3.5"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M16 13V29C16 32.3137 18.6863 35 22 35C25.3137 35 28 32.3137 28 29V19C28 15.6863 30.6863 13 34 13C37.3137 13 40 15.6863 40 19V32"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3.5"
                ></path>
                <circle cx="16" cy="13" fill="currentColor" r="3"></circle>
                <circle cx="40" cy="32" fill="currentColor" r="3"></circle>
              </svg>
            </div>
          </div>
          <!-- Route Label / Name -->
          <h3 class="text-[20px] font-bold text-[#0f172a] tracking-tight">
            Ruta Centro - Sur
          </h3>
        </section>
        <!-- END: RouteVisualIdentification -->
        <!-- BEGIN: ActionButtons -->
        <footer
          class="w-full grid grid-cols-2 gap-3.5 mt-1"
          data-purpose="modal-actions"
        >
          <!-- Cancel button -->
          <button
            class="w-full py-2.5 px-4 bg-white border border-[#d5dee8] hover:bg-slate-50 active:bg-slate-100 text-[#596d85] font-medium text-[15px] rounded-xl transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-slate-300"
            data-purpose="cancel-action-button"
            type="button"
          >
            Cancelar
          </button>
          <!-- Confirm Delete button -->
          <button
            class="w-full py-2.5 px-4 bg-[#1e5ede] hover:bg-[#1a52c4] active:bg-[#1746a8] text-white font-medium text-[15px] rounded-xl shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            data-purpose="confirm-delete-button"
            type="button"
          >
            Eliminar
          </button>
        </footer>
        <!-- END: ActionButtons -->
      </div>
      <!-- END: ConfirmationCard -->
    </div>
    <!-- END: ModalContainer -->
  </body>
</html>
