<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Información del Administrador</title>
    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eef4ff",
                100: "#e0ebff",
                600: "#2060e2",
                700: "#1a4fc2",
              },
            },
          },
        },
      };
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style data-purpose="typography">
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased text-slate-800 bg-[#f8fafc]"
  >
    <!-- BEGIN: AdminProfileModal -->
    <main
      class="w-full max-w-[490px] bg-white rounded-2xl px-8 py-7 sm:px-10 sm:py-8 flex flex-col items-center border border-slate-100 shadow-xl"
      data-purpose="admin-info-modal"
    >
      <!-- Modal Title -->
      <header class="w-full text-center mb-6">
        <h1 class="text-[21px] font-bold text-slate-900 tracking-tight">
          Información del Administrador
        </h1>
      </header>
      <!-- BEGIN: UserIdentitySection -->
      <section
        class="flex flex-col items-center mb-6"
        data-purpose="profile-header"
      >
        <!-- Avatar with Shield/Admin Emblem -->
        <div
          aria-hidden="true"
          class="w-20 h-20 rounded-full bg-[#e8f1fd] flex items-center justify-center mb-3.5 shadow-sm"
        >
          <div class="relative flex items-center justify-center">
            <svg
              class="w-10 h-10 text-[#1d5cd6]"
              viewBox="0 0 48 48"
              fill="currentColor"
            >
              <path
                d="M24 4L8 10v12.2c0 10.1 6.8 19.5 16 21.8 1.9-.5 3.7-1.3 5.3-2.3-1.4-2.1-2.3-4.6-2.3-7.4 0-7.3 5.8-13.3 13-13.3.7 0 1.4.1 2 .2V10L24 4z"
                fill="#1d5cd6"
              ></path>
              <circle
                cx="36"
                cy="33"
                r="9.5"
                fill="#1d5cd6"
                stroke="#e8f1fd"
                stroke-width="1.5"
              ></circle>
              <circle cx="36" cy="30" r="3" fill="#ffffff"></circle>
              <path
                d="M30.8 38.2c.8-2.6 3-4.2 5.2-4.2s4.4 1.6 5.2 4.2c-.8.8-2.8 1.8-5.2 1.8s-4.4-1-5.2-1.8z"
                fill="#ffffff"
              ></path>
            </svg>
          </div>
        </div>
        <!-- User Full Name -->
        <h2 class="text-lg font-bold text-slate-900 leading-snug">
          Carlos Andrés
        </h2>
        <!-- User Role Subtitle -->
        <p class="text-sm text-slate-500 font-normal mt-0.5">
          Información del Administrador
        </p>
      </section>
      <!-- END: UserIdentitySection -->
      <!-- Top Divider -->
      <hr class="w-full border-t border-slate-100 mb-6" />
      <!-- BEGIN: UserDetailsList -->
      <section
        class="w-full flex flex-col gap-4 text-left"
        data-purpose="details-list"
      >
        <!-- Item: Nombre -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]">Nombre</span>
          <span class="text-[14px] text-[#64748b] mt-0.5">Carlos Andrés</span>
        </div>
        <!-- Item: Apellidos -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]">Apellidos</span>
          <span class="text-[14px] text-[#64748b] mt-0.5">Pérez Gómez</span>
        </div>
        <!-- Item: Correo Electrónico -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]"
            >Correo Electrónico</span
          >
          <span class="text-[14px] text-[#64748b] mt-0.5"
            >carlos.perez@admin.com</span
          >
        </div>
        <!-- Item: Identificación -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]">Identificación</span>
          <span class="text-[14px] text-[#64748b] mt-0.5">11111111</span>
        </div>
        <!-- Item: Teléfono -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]">Teléfono</span>
          <span class="text-[14px] text-[#64748b] mt-0.5"
            >+57 315 777 8888</span
          >
        </div>
        <!-- Item: Fecha Nacimiento -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]">Fecha Nacimiento</span>
          <span class="text-[14px] text-[#64748b] mt-0.5">1988-09-12</span>
        </div>
        <!-- Item: Dirección -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-[#1e293b]">Dirección</span>
          <span class="text-[14px] text-[#64748b] mt-0.5">Calle 20 #10-50</span>
        </div>
      </section>
      <!-- END: UserDetailsList -->
      <!-- Bottom Divider -->
      <hr class="w-full border-t border-slate-100 mt-6 mb-7" />
      <!-- BEGIN: ModalActions -->
      <footer class="w-full flex justify-center" data-purpose="modal-actions">
        <!-- Close Button -->
        <button
          class="w-36 py-2.5 px-6 rounded-xl bg-[#2060e2] hover:bg-[#1952c4] active:scale-[0.98] transition-all duration-150 text-white font-semibold text-sm shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          onclick="window.history.back?.() || window.close?.()"
          type="button"
        >
          Cerrar
        </button>
      </footer>
      <!-- END: ModalActions -->
    </main>
    <!-- END: AdminProfileModal -->
  </body>
</html>
