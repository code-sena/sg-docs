<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Correo Actualizado - Confirmación</title>
<!-- Google Fonts: Inter para máxima fidelidad tipográfica moderna -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 con plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#1b5bf5',
              blueHover: '#154cd6',
              navy: '#172747',
              muted: '#62718d',
              cardBg: '#ffffff',
            }
          },
          boxShadow: {
            'card-subtle': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.025)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f3f6fa] flex items-center justify-center p-4 selection:bg-blue-100 selection:text-blue-700">
<!-- BEGIN: ModalContainer -->
<main class="w-full flex items-center justify-center" data-purpose="modal-wrapper">
<!-- Tarjeta de confirmación blanca con bordes curvos suaves -->
<section aria-labelledby="modal-title" aria-modal="true" class="w-full max-w-[448px] bg-white rounded-[28px] px-8 pt-11 pb-10 shadow-card-subtle flex flex-col items-center text-center transition-all duration-300" role="dialog">
<!-- BEGIN: SuccessIcon -->
<!-- Círculo azul vibrante con ícono de check blanco -->
<div class="w-[74px] h-[74px] rounded-full bg-[#1b5bf5] flex items-center justify-center mb-7 shadow-sm transition-transform duration-200 hover:scale-105" data-purpose="status-icon">
<svg aria-hidden="true" class="w-9 h-9 text-white stroke-[3.2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7"></path>
</svg>
</div>
<!-- END: SuccessIcon -->
<!-- BEGIN: ModalContent -->
<!-- Título principal -->
<h1 class="text-[25px] font-bold text-[#172747] tracking-[-0.015em] mb-4 leading-tight" id="modal-title">
        Correo actualizado
      </h1>
<!-- Mensaje descriptivo de estado -->
<p class="text-[16px] text-[#62718d] font-normal leading-relaxed max-w-[340px] mb-8">
        Su correo ha sido actualizado correctamente.
      </p>
<!-- END: ModalContent -->
<!-- BEGIN: ActionButton -->
<!-- Botón tipo píldora centrado -->
<button class="w-[172px] h-[52px] bg-[#1b5bf5] hover:bg-[#154cd6] active:scale-[0.98] text-white font-medium text-[16px] rounded-full flex items-center justify-center transition-all duration-150 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/20" data-purpose="confirm-action" onclick="handleDismiss()" type="button">
        Aceptar
      </button>
<!-- END: ActionButton -->
</section>
</main>
<!-- END: ModalContainer -->
<!-- BEGIN: InteractivityScript -->
<script data-purpose="interaction-handlers">
    function handleDismiss() {
      // Proporciona retroalimentación interactiva al hacer click en 'Aceptar'
      const card = document.querySelector('section[role="dialog"]');
      if (card) {
        card.classList.add('scale-95', 'opacity-80');
        setTimeout(() => {
          card.classList.remove('scale-95', 'opacity-80');
        }, 150);
      }
    }
  </script>
<!-- END: InteractivityScript -->
</body></html>
