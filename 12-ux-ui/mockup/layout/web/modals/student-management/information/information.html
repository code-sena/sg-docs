<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Information Modal</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            card: {
              title: '#1a233a',
              subtitle: '#6b7280',
              label: '#1e293b',
              value: '#64748b',
              divider: '#edf2f7',
              avatarBg: '#e8f0fe',
              avatarIcon: '#2563eb',
              btn: '#1d5bd8',
              btnHover: '#174ec2',
            }
          },
          boxShadow: {
            'modal': '0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.025)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-overrides">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 text-slate-800 font-sans">
<!-- BEGIN: StudentInformationModal -->
<main class="w-full max-w-[490px] bg-white rounded-2xl sm:rounded-3xl shadow-modal border border-slate-100/80 px-8 sm:px-12 pt-8 pb-9 my-6 transition-all" data-purpose="student-info-modal">
<!-- BEGIN: ModalHeader -->
<header class="flex flex-col items-center text-center mb-6" data-purpose="modal-header">
<!-- Modal Top Title -->
<h1 class="text-[20px] font-bold text-card-title tracking-tight mb-5">
        Student information
      </h1>
<!-- Circular Avatar Container -->
<div class="w-20 h-20 rounded-full bg-card-avatarBg flex items-center justify-center mb-3 shadow-inner" data-purpose="student-avatar">
<!-- User Silhouette SVG Icon -->
<svg aria-hidden="true" class="w-8 h-8 text-card-avatarIcon fill-current" viewbox="0 0 24 24">
<path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"></path>
</svg>
</div>
<!-- Student Name and Role -->
<h2 class="text-[17px] font-bold text-card-title tracking-normal mb-1">
        Juan Carlos García
      </h2>
<p class="text-[13.5px] font-normal text-card-subtitle">
        Student information
      </p>
</header>
<!-- END: ModalHeader -->
<!-- Upper Divider Line -->
<hr class="border-t border-slate-100 w-full mb-5"/>
<!-- BEGIN: StudentDetailsList -->
<section aria-label="Student details" class="space-y-4" data-purpose="details-list">
<!-- Field: Names -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Names</span>
<span class="text-[13.5px] font-normal text-card-value">Juan Carlos García</span>
</div>
<!-- Field: Last names -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Last names</span>
<span class="text-[13.5px] font-normal text-card-value">López Martínez</span>
</div>
<!-- Field: ID type -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">ID type</span>
<span class="text-[13.5px] font-normal text-card-value">CC</span>
</div>
<!-- Field: Identification -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Identification</span>
<span class="text-[13.5px] font-normal text-card-value">1234567890</span>
</div>
<!-- Field: Date of birth -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Date of birth</span>
<span class="text-[13.5px] font-normal text-card-value">2010-05-15</span>
</div>
<!-- Field: Grade -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Grade</span>
<span class="text-[13.5px] font-normal text-card-value">9°</span>
</div>
<!-- Field: Phone -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Phone</span>
<span class="text-[13.5px] font-normal text-card-value">+57 321 456 7890</span>
</div>
<!-- Field: Address -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Address</span>
<span class="text-[13.5px] font-normal text-card-value">Calle 5 #12-34</span>
</div>
<!-- Field: Email -->
<div class="flex flex-col" data-purpose="field-item">
<span class="text-[13px] font-semibold text-card-label mb-0.5">Email</span>
<span class="text-[13.5px] font-normal text-card-value break-all">juan.garcia@school.com</span>
</div>
</section>
<!-- END: StudentDetailsList -->
<!-- Lower Divider Line -->
<hr class="border-t border-slate-100 w-full mt-6 mb-7"/>
<!-- BEGIN: ModalActions -->
<footer class="flex justify-center items-center" data-purpose="modal-footer">
<button aria-label="Close dialog" class="w-[145px] py-2.5 px-6 bg-card-btn hover:bg-card-btnHover active:scale-[0.98] text-white text-[15px] font-medium rounded-xl shadow-sm transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600" id="btn-close-modal" type="button">
        Close
      </button>
</footer>
<!-- END: ModalActions -->
</main>
<!-- END: StudentInformationModal -->
</body></html>
