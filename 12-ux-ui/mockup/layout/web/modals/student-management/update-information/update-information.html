<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Update Student - Guardian Escolar</title>
<!-- Tailwind CSS CDN with Forms and Container Queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="form-controls">
    /* Remove default appearance for custom styled selects */
    select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.75rem center;
      background-repeat: no-repeat;
      background-size: 1.25em 1.25em;
      padding-right: 2.5rem;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800 antialiased">
<!-- BEGIN: ModalContainer -->
<main class="w-full max-w-[490px] bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden" data-purpose="student-edit-modal">
<!-- BEGIN: ModalHeader -->
<header class="pt-6 pb-4 text-center">
<h1 class="text-xl font-bold text-slate-800 tracking-tight">Update student</h1>
</header>
<!-- END: ModalHeader -->
<!-- Top Divider Line -->
<div class="h-px bg-slate-100 w-full px-6">
<div class="h-px bg-slate-100 w-full"></div>
</div>
<!-- BEGIN: ProfileSummary -->
<section class="flex flex-col items-center pt-6 pb-6 px-6" data-purpose="student-avatar-section">
<!-- Circular Avatar Badge -->
<div class="w-16 h-16 rounded-full bg-[#eef2f6] flex items-center justify-center mb-3">
<svg aria-hidden="true" class="w-8 h-8 text-[#1b2a4a]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"></path>
</svg>
</div>
<!-- Student Name Title -->
<h2 class="text-base font-bold text-slate-800">Juan Carlos García</h2>
</section>
<!-- END: ProfileSummary -->
<!-- Secondary Divider Line -->
<div class="h-px bg-slate-100 mx-6"></div>
<!-- BEGIN: UpdateForm -->
<form class="px-6 py-5 space-y-4" data-purpose="update-student-form" onsubmit="event.preventDefault();">
<!-- Field: Names -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="first_names">Names</label>
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition" id="first_names" name="names" type="text" value="Juan Carlos García"/>
</div>
<!-- Field: Last names -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="last_names">Last names</label>
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition" id="last_names" name="last_names" type="text" value="López Martínez"/>
</div>
<!-- Field: ID type -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="id_type">ID type</label>
<select class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition appearance-none cursor-pointer" id="id_type" name="id_type">
<option selected="" value="CC">CC</option>
<option value="TI">TI</option>
<option value="CE">CE</option>
<option value="RC">RC</option>
</select>
</div>
<!-- Field: Identification -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="identification">Identification</label>
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition" id="identification" name="identification" type="text" value="1234567890"/>
</div>
<!-- Field: Date of birth -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="dob">Date of birth</label>
<div class="relative">
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition pr-10" id="dob" name="dob" type="text" value="15/05/2010"/>
<div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-700">
<!-- Calendar Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
</div>
</div>
</div>
<!-- Field: Grade -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="grade">Grade</label>
<select class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition appearance-none cursor-pointer h-[38px]" id="grade" name="grade">
<option disabled="" selected="" value=""></option>
<option value="6">6° Basic Secondary</option>
<option value="7">7° Basic Secondary</option>
<option value="8">8° Basic Secondary</option>
<option value="9">9° Basic Secondary</option>
<option value="10">10° High School</option>
<option value="11">11° High School</option>
</select>
</div>
<!-- Field: Phone -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="phone">Phone</label>
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition" id="phone" name="phone" type="tel" value="+57 321 456 7890"/>
</div>
<!-- Field: Address -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="address">Address</label>
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition" id="address" name="address" type="text" value="Calle 5 #12-34"/>
</div>
<!-- Field: Email -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="email">Email</label>
<input class="w-full px-3.5 py-2 text-sm text-slate-800 bg-[#f8fafc] border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400 transition" id="email" name="email" type="email" value="juan.garcia@school.com"/>
</div>
<!-- Bottom Form Divider -->
<div class="pt-2">
<div class="h-px bg-slate-100 -mx-6 mb-5"></div>
</div>
<!-- BEGIN: ActionButtons -->
<div class="grid grid-cols-2 gap-3.5 pt-1 pb-3" data-purpose="form-actions">
<!-- Cancel Action -->
<button class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-slate-800 bg-[#eff2f4] hover:bg-slate-200 active:bg-slate-300 transition text-center" type="button">
          Cancel
        </button>
<!-- Submit/Save Action -->
<button class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-[#1a2d4b] hover:bg-[#15243d] active:bg-[#0f1a2c] shadow-sm transition text-center" type="submit">
          Save changes
        </button>
</div>
<!-- END: ActionButtons -->
</form>
<!-- END: UpdateForm -->
</main>
<!-- END: ModalContainer -->
</body></html>
