<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delete Student Confirmation</title>
<!-- Tailwind CSS v3 CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
<style data-purpose="modal-styling">
    /* Subtle modal card elevation matching the reference image */
    .modal-shadow {
      box-shadow: 0 10px 30px -4px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
<!-- BEGIN: DeleteStudentModal -->
<main aria-describedby="modal-description" aria-labelledby="modal-title" aria-modal="true" class="w-full max-w-[450px]" role="dialog">
<!-- Card Container -->
<div class="bg-white rounded-[28px] modal-shadow border border-slate-100/80 px-8 pt-10 pb-9 sm:px-11 flex flex-col items-center text-center" data-purpose="confirmation-card">
<!-- Header Section: Title and Description -->
<!-- BEGIN: ModalHeader -->
<header class="mb-8">
<h1 class="text-[26px] font-bold tracking-tight text-[#0f172a] mb-2.5 leading-snug" id="modal-title">
          Delete student
        </h1>
<p class="text-[15px] leading-relaxed text-slate-600 max-w-[280px] mx-auto font-normal" id="modal-description">
          This will permanently delete the selected student record.
        </p>
</header>
<!-- END: ModalHeader -->
<!-- Student Profile Badge -->
<!-- BEGIN: StudentProfile -->
<div class="flex flex-col items-center mb-9" data-purpose="student-identity">
<!-- Avatar Circle with Soft Light Blue Fill -->
<div class="w-[104px] h-[104px] rounded-full bg-[#ebf3fe] flex items-center justify-center mb-5 ring-1 ring-blue-100/40">
<!-- Dark User Silhouette Icon -->
<svg aria-hidden="true" class="w-11 h-11 text-[#0f172a]" fill="currentColor" viewbox="0 0 24 24">
<!-- User Head -->
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"></path>
<!-- User Shoulders/Torso -->
<path d="M12 14.5c-3.7 0-7 1.9-7 4.25v.75a.5.5 0 00.5.5h13a.5.5 0 00.5-.5v-.75c0-2.35-3.3-4.25-7-4.25z"></path>
</svg>
</div>
<!-- Student Name -->
<h2 class="text-[23px] font-bold text-[#0f172a] tracking-tight">
          Juan Carlos García
        </h2>
</div>
<!-- END: StudentProfile -->
<!-- Action Buttons Row -->
<!-- BEGIN: ActionButtons -->
<div class="w-full flex items-center gap-3.5 pt-1" data-purpose="modal-actions">
<!-- Cancel Button -->
<button class="flex-1 py-3 px-4 bg-white border border-slate-200 hover:bg-slate-50 active:bg-slate-100 text-[#475569] font-medium text-[16px] rounded-[16px] transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-1" data-purpose="cancel-action" type="button">
          Cancel
        </button>
<!-- Delete Confirmation Button -->
<button class="flex-1 py-3 px-4 bg-[#1d5bd8] hover:bg-[#184ebd] active:bg-[#1341a0] text-white font-medium text-[16px] rounded-[16px] transition-colors focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-1 shadow-sm" data-purpose="confirm-delete-action" type="button">
          Delete
        </button>
</div>
<!-- END: ActionButtons -->
</div>
</main>
<!-- END: DeleteStudentModal -->
</body></html>
