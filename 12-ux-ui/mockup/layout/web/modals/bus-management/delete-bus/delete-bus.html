<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Eliminar Bus - Guardian Escolar</title>
    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style data-purpose="typography">
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800"
  >
    <!-- BEGIN: DeleteBusModal -->
    <div
      class="w-full max-w-[390px] bg-white rounded-2xl shadow-xl shadow-slate-200/70 p-7 sm:p-8 flex flex-col items-center text-center border border-slate-100 transition-all"
      data-purpose="delete-confirmation-dialog"
    >
      <!-- Modal Header: Title & Subtitle warning -->
      <header class="w-full mb-6">
        <h2 class="text-[22px] font-bold text-slate-900 leading-tight">
          Eliminar Bus
        </h2>
        <p
          class="text-[14px] text-slate-600 mt-2 leading-snug px-2 font-normal"
        >
          ¿Deseas eliminar este bus? Esta acción no se puede deshacer.
        </p>
      </header>
      <!-- Modal Graphic: Bus Record Preview -->
      <div
        class="flex flex-col items-center mb-8"
        data-purpose="record-indicator"
      >
        <!-- Bus Avatar Container -->
        <div
          class="w-20 h-20 rounded-full bg-[#ebf3fc] border border-blue-100/60 flex items-center justify-center shadow-inner mb-3.5"
        >
          <!-- Bus Icon SVG -->
          <svg
            aria-hidden="true"
            class="w-7 h-7 text-slate-900"
            fill="currentColor"
            viewbox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"
            ></path>
          </svg>
        </div>
        <!-- Bus Identifier / Title -->
        <span class="text-xl font-bold text-slate-900 tracking-tight">
          Registro
        </span>
      </div>
      <!-- Actions: Cancel and Delete buttons -->
      <footer class="w-full grid grid-cols-2 gap-3.5">
        <!-- Cancel Button -->
        <button
          class="w-full py-3 px-4 bg-white border border-slate-300/80 hover:bg-slate-50 hover:border-slate-400 active:bg-slate-100 text-slate-600 font-medium text-[15px] rounded-xl transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-1"
          data-purpose="cancel-action"
          type="button"
        >
          Cancelar
        </button>
        <!-- Delete Button -->
        <button
          class="w-full py-3 px-4 bg-[#1d5ce5] hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-[15px] rounded-xl shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-1"
          data-purpose="confirm-delete-action"
          type="button"
        >
          Eliminar
        </button>
      </footer>
    </div>
    <!-- END: DeleteBusModal -->
  </body>
</html>
