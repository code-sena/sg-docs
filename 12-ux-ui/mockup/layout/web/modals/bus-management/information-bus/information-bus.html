<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Guardian Escolar - Información del Bus</title>
    <!-- Load Tailwind CSS v3 with forms and container-queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#215ee6",
                700: "#1d4ed8",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased font-sans text-slate-800"
  >
    <!-- BEGIN: BusInfoModal -->
    <main
      class="w-full max-w-[480px] bg-white rounded-3xl shadow-xl shadow-slate-200/60 overflow-hidden px-8 py-9 transition-all"
      data-purpose="bus-details-modal"
    >
      <!-- BEGIN: HeaderSection -->
      <header class="flex flex-col items-center text-center">
        <!-- Main Modal Title -->
        <h1
          class="text-[22px] font-bold text-slate-900 tracking-tight mb-6"
          data-purpose="modal-title"
        >
          Información del Bus
        </h1>
        <!-- Bus Circular Icon Badge -->
        <div
          aria-hidden="true"
          class="w-20 h-20 rounded-full bg-[#EBF3FF] flex items-center justify-center mb-4 text-[#215ee6]"
          data-purpose="icon-container"
        >
          <!-- Lucide Bus Icon SVG -->
          <svg
            class="w-10 h-10"
            fill="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"
            ></path>
          </svg>
        </div>
        <!-- Registration Subtitle -->
        <h2
          class="text-[17px] font-bold text-slate-800 tracking-tight leading-snug"
        >
          Registro
        </h2>
        <p class="text-[13px] text-slate-400 font-normal mt-0.5 mb-5">
          Información del Bus
        </p>
      </header>
      <!-- END: HeaderSection -->
      <!-- Top Divider -->
      <hr class="border-slate-100 mb-5" />
      <!-- BEGIN: BusDetailsList -->
      <div class="space-y-4 px-1" data-purpose="bus-attributes-list">
        <!-- Field: Matrícula -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Matrícula</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >CND-2024</span
          >
        </div>
        <!-- Field: Conductor -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Conductor</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >Pedro Daniel Rodríguez</span
          >
        </div>
        <!-- Field: Modelo -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Modelo</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >2022</span
          >
        </div>
        <!-- Field: Marca -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Marca</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >Mercedes Benz</span
          >
        </div>
        <!-- Field: Capacidad Máxima -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Capacidad Máxima</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >45</span
          >
        </div>
        <!-- Field: Estado del GPS -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Estado del GPS</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >Activo</span
          >
        </div>
        <!-- Field: Vigencia SOAT -->
        <div class="flex flex-col">
          <span class="text-sm font-bold text-slate-800">Vigencia SOAT</span>
          <span class="text-[13.5px] text-slate-500 font-normal mt-0.5"
            >2025-06-30</span
          >
        </div>
      </div>
      <!-- END: BusDetailsList -->
      <!-- Bottom Divider -->
      <hr class="border-slate-100 mt-6 mb-6" />
      <!-- BEGIN: ActionFooter -->
      <footer class="flex justify-center" data-purpose="modal-actions">
        <button
          class="bg-[#215ee6] hover:bg-[#1a4ec8] active:bg-[#1643ab] text-white text-[15px] font-medium py-2.5 px-12 rounded-xl transition-colors duration-150 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#215ee6] focus:ring-offset-2"
          data-purpose="close-button"
          type="button"
        >
          Cerrar
        </button>
      </footer>
      <!-- END: ActionFooter -->
    </main>
    <!-- END: BusInfoModal -->
  </body>
</html>
