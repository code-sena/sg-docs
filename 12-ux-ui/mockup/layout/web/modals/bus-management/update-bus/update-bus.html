<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Guardian Escolar - Actualizar Bus</title>
    <!-- Tailwind CSS v3 with forms and container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script data-purpose="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: "#22344c",
                navyHover: "#182538",
                cancelGray: "#eeeeee",
                cancelGrayHover: "#e2e2e2",
                inputBg: "#f8fafc",
                iconBg: "#eff6ff",
              },
            },
          },
        },
      };
    </script>
    <style data-purpose="custom-inputs">
      /* Remove native browser select arrow styling to allow precise custom SVG arrows */
      .custom-select {
        background-image: none !important;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
      }

      /* Ensure clean typography and consistent rendering */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-slate-100 flex items-center justify-center p-4 sm:p-6 text-slate-800 antialiased"
  >
    <!-- BEGIN: ModalContainer -->
    <main
      class="w-full max-w-[530px] bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:px-8 sm:py-7"
      data-purpose="update-bus-modal"
    >
      <!-- BEGIN: HeaderSection -->
      <header class="text-center">
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">
          Actualizar bus
        </h1>
        <!-- Top subtle divider -->
        <hr class="mt-4 border-t border-slate-200" />
      </header>
      <!-- END: HeaderSection -->
      <!-- BEGIN: BusIdentifierSection -->
      <div
        class="flex flex-col items-center mt-5 mb-5"
        data-purpose="bus-badge-container"
      >
        <!-- Circular bus icon container -->
        <div
          class="w-20 h-20 rounded-full bg-[#f0f4f9] flex items-center justify-center text-[#20324c] shadow-inner"
        >
          <!-- Front view bus icon -->
          <svg
            aria-hidden="true"
            class="w-10 h-10"
            fill="currentColor"
            viewbox="0 0 24 24"
          >
            <path
              d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"
            ></path>
          </svg>
        </div>
        <!-- Plate license tag -->
        <span class="mt-3 text-lg font-bold text-slate-900 tracking-wide"
          >CND-2024</span
        >
      </div>
      <!-- Sub-header divider -->
      <hr class="border-t border-slate-200 mb-5" />
      <!-- END: BusIdentifierSection -->
      <!-- BEGIN: FormFieldsSection -->
      <form
        action="#"
        class="space-y-4"
        data-purpose="update-bus-form"
        method="POST"
        onsubmit="event.preventDefault()"
      >
        <!-- Field: Matrícula del bus -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="plate-number"
          >
            Matrícula del bus
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors"
            id="plate-number"
            name="plate_number"
            type="text"
            value="CND-2024"
          />
        </div>
        <!-- Field: Conductor -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="driver-select"
          >
            Conductor
          </label>
          <div class="relative">
            <select
              class="custom-select w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors cursor-pointer"
              id="driver-select"
              name="driver"
            >
              <option disabled="" hidden="" selected="" value=""></option>
              <option value="driver_1">Carlos Mendoza</option>
              <option value="driver_2">Juan Pérez</option>
              <option value="driver_3">Andrés Gómez</option>
            </select>
            <!-- Custom Chevron Icon -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400"
            >
              <svg class="h-4 w-4" fill="currentColor" viewbox="0 0 20 20">
                <path
                  clip-rule="evenodd"
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                  fill-rule="evenodd"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <!-- Field: Modelo -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="bus-model"
          >
            Modelo
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors"
            id="bus-model"
            name="model"
            type="text"
            value="2022"
          />
        </div>
        <!-- Field: Marca -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="bus-brand"
          >
            Marca
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors"
            id="bus-brand"
            name="brand"
            type="text"
            value="Mercedes Benz"
          />
        </div>
        <!-- Field: Capacidad máxima -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="bus-capacity"
          >
            Capacidad máxima
          </label>
          <input
            class="w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors"
            id="bus-capacity"
            name="capacity"
            type="number"
            value="45"
          />
        </div>
        <!-- Field: Vigencia SOAT -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="soat-expiry"
          >
            Vigencia SOAT
          </label>
          <div class="relative">
            <input
              class="w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors pr-10"
              id="soat-expiry"
              name="soat_expiry"
              type="text"
              value="30 / 06 / 2025"
            />
            <!-- Calendar Icon -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-700"
            >
              <svg
                class="h-4 w-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"
              >
                <rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
                <line x1="16" x2="16" y1="2" y2="6"></line>
                <line x1="8" x2="8" y1="2" y2="6"></line>
                <line x1="3" x2="21" y1="10" y2="10"></line>
              </svg>
            </div>
          </div>
        </div>
        <!-- Field: Estado del GPS -->
        <div>
          <label
            class="block text-xs font-semibold text-slate-700 mb-1.5"
            for="gps-status"
          >
            Estado del GPS
          </label>
          <div class="relative">
            <select
              class="custom-select w-full rounded-lg border border-slate-200 bg-[#f9fafb] px-3.5 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors cursor-pointer"
              id="gps-status"
              name="gps_status"
            >
              <option selected="" value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
              <option value="En Mantenimiento">En Mantenimiento</option>
            </select>
            <!-- Custom Chevron Icon -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400"
            >
              <svg class="h-4 w-4" fill="currentColor" viewbox="0 0 20 20">
                <path
                  clip-rule="evenodd"
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                  fill-rule="evenodd"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <!-- Pre-footer divider -->
        <div class="pt-2">
          <hr class="border-t border-slate-200 mb-5" />
        </div>
        <!-- BEGIN: ActionButtons -->
        <div class="grid grid-cols-2 gap-4 pt-1" data-purpose="modal-actions">
          <!-- Cancel Button -->
          <button
            class="w-full py-3 px-4 bg-[#ededed] hover:bg-[#e4e4e4] active:bg-[#dbdbdb] text-slate-800 text-sm font-semibold rounded-lg text-center transition-colors"
            type="button"
          >
            Cancelar
          </button>
          <!-- Save Button -->
          <button
            class="w-full py-3 px-4 bg-[#21324a] hover:bg-[#1a283b] active:bg-[#131e2d] text-white text-sm font-semibold rounded-lg text-center shadow-sm transition-colors"
            type="submit"
          >
            Guardar cambios
          </button>
        </div>
        <!-- END: ActionButtons -->
      </form>
      <!-- END: FormFieldsSection -->
    </main>
    <!-- END: ModalContainer -->
  </body>
</html>
