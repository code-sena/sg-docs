<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Actualizar escuela - Guardian Escolar</title>
    <!-- Tailwind CSS v3 CDN with forms plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: "#243447",
                dark: "#1e2b3c",
                blueSoft: "#eef3f8",
                inputBg: "#f8fafc",
                border: "#e2e8f0",
                label: "#374151",
              },
            },
          },
        },
      };
    </script>
    <!-- Custom typography styles -->
    <style data-purpose="typography">
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-slate-200"
  >
    <!-- BEGIN: ModalContainer -->
    <main
      class="w-full max-w-[520px] bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden"
      data-purpose="modal-card"
    >
      <!-- BEGIN: HeaderSection -->
      <header class="pt-7 pb-4 px-8 text-center" data-purpose="modal-header">
        <h1 class="text-[1.35rem] font-bold text-gray-900 tracking-tight">
          Actualizar escuela
        </h1>
      </header>
      <!-- END: HeaderSection -->
      <div class="w-full border-t border-gray-100"></div>
      <!-- BEGIN: SchoolBadgeSection -->
      <section
        class="pt-6 pb-5 flex flex-col items-center justify-center"
        data-purpose="institution-summary"
      >
        <!-- Circular Avatar Badge with Mortarboard Icon -->
        <div
          class="w-20 h-20 rounded-full bg-[#eef4f9] flex items-center justify-center mb-3 shadow-inner text-[#1f2b3e]"
          data-purpose="avatar-container"
        >
          <svg
            class="w-10 h-10 fill-current"
            viewbox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 3L1 9l11 6l9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"
            ></path>
          </svg>
        </div>
        <h2 class="text-lg font-bold text-gray-900 tracking-tight">
          Colegio Técnico Neiva
        </h2>
      </section>
      <!-- END: SchoolBadgeSection -->
      <div class="w-full border-t border-gray-100 mb-6"></div>
      <!-- BEGIN: FormSection -->
      <form
        action="#"
        class="px-8 pb-7 space-y-4"
        data-purpose="update-school-form"
        method="POST"
        onsubmit="event.preventDefault()"
      >
        <!-- Field 1: Nombre -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="nombre"
            >Nombre</label
          >
          <input
            class="w-full rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none"
            id="nombre"
            name="nombre"
            type="text"
            value="Colegio Técnico Neiva"
          />
        </div>
        <!-- Field 2: Ciudad -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="ciudad"
            >Ciudad</label
          >
          <div class="relative">
            <select
              class="w-full appearance-none rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none pr-8 cursor-pointer"
              id="ciudad"
              name="ciudad"
            >
              <option selected="" value=""></option>
              <option value="neiva">Neiva</option>
              <option value="bogota">Bogotá</option>
              <option value="medellin">Medellín</option>
              <option value="cali">Cali</option>
            </select>
            <!-- Custom Select Arrow -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500"
            >
              <svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 20 20">
                <path
                  clip-rule="evenodd"
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                  fill-rule="evenodd"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <!-- Field 3: Dirección -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="direccion"
            >Dirección</label
          >
          <input
            class="w-full rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none"
            id="direccion"
            name="direccion"
            type="text"
            value="Calle 50 #20-30"
          />
        </div>
        <!-- Field 4: Teléfono -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="telefono"
            >Teléfono</label
          >
          <input
            class="w-full rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none"
            id="telefono"
            name="telefono"
            type="tel"
            value="+57 8 876 5432"
          />
        </div>
        <!-- Field 5: Escolaridad -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="escolaridad"
            >Escolaridad</label
          >
          <div class="relative">
            <select
              class="w-full appearance-none rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none pr-8 cursor-pointer"
              id="escolaridad"
              name="escolaridad"
            >
              <option selected="" value=""></option>
              <option value="primaria">Primaria</option>
              <option value="secundaria">Secundaria</option>
              <option value="media_tecnica">Media Técnica</option>
              <option value="completa">Completa</option>
            </select>
            <!-- Custom Select Arrow -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500"
            >
              <svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 20 20">
                <path
                  clip-rule="evenodd"
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                  fill-rule="evenodd"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <!-- Field 6: Correo electrónico -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="email"
            >Correo electrónico</label
          >
          <input
            class="w-full rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none"
            id="email"
            name="email"
            type="email"
            value="info@colegiotecnico.edu.co"
          />
        </div>
        <!-- Field 7: Página web -->
        <div data-purpose="form-field">
          <label
            class="block text-[0.82rem] font-medium text-gray-700 mb-1.5"
            for="web"
            >Página web</label
          >
          <input
            class="w-full rounded-lg border-gray-200 bg-[#f8fafd] px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors shadow-none"
            id="web"
            name="web"
            type="text"
            value="www.colegiotecnico.edu.co"
          />
        </div>
        <!-- Subtle Divider above action buttons -->
        <div class="pt-2 border-b border-gray-100 mb-4"></div>
        <!-- BEGIN: ActionButtons -->
        <div
          class="pt-2 flex items-center justify-between gap-3.5"
          data-purpose="action-buttons-group"
        >
          <!-- Cancelar Button -->
          <button
            class="w-1/2 py-3 px-4 rounded-xl text-sm font-semibold text-gray-800 bg-[#f0f0f2] hover:bg-gray-200 active:bg-gray-300 transition-all text-center tracking-normal shadow-sm"
            data-purpose="cancel-button"
            type="button"
          >
            Cancelar
          </button>
          <!-- Guardar cambios Button -->
          <button
            class="w-1/2 py-3 px-4 rounded-xl text-sm font-semibold text-white bg-[#202f43] hover:bg-[#192535] active:bg-[#121c2a] transition-all text-center tracking-normal shadow-sm"
            data-purpose="submit-button"
            type="submit"
          >
            Guardar cambios
          </button>
        </div>
        <!-- END: ActionButtons -->
      </form>
      <!-- END: FormSection -->
    </main>
    <!-- END: ModalContainer -->
  </body>
</html>
