<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Información de la Escuela</title>
    <!-- Tailwind CSS v3 with forms & container queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style data-purpose="typography">
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800 antialiased"
  >
    <!-- BEGIN: ModalContainer -->
    <main
      class="w-full max-w-[460px] bg-white rounded-2xl shadow-xl border border-slate-100 px-7 py-8 sm:px-8 sm:py-9"
      data-purpose="school-info-modal"
    >
      <!-- BEGIN: HeaderSection -->
      <header class="text-center" data-purpose="modal-header">
        <!-- Main Modal Title -->
        <h1
          class="text-[21px] sm:text-[22px] font-bold text-slate-900 tracking-tight mb-6"
        >
          Información de la Escuela
        </h1>
        <!-- School Icon Avatar -->
        <div
          class="mx-auto w-16 h-16 rounded-full bg-blue-50 border border-blue-100/60 flex items-center justify-center mb-4"
          data-purpose="avatar-icon"
        >
          <svg
            aria-hidden="true"
            class="w-8 h-8 text-blue-600 fill-current"
            viewbox="0 0 24 24"
          >
            <!-- Academic Mortarboard / Graduation Cap Icon -->
            <path d="M12 3L1 9l11 6l9-4.91V17h2V9L12 3z"></path>
            <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"></path>
          </svg>
        </div>
        <!-- School Name & Tagline -->
        <h2 class="text-lg font-bold text-slate-900 leading-snug">
          Colegio Técnico Neiva
        </h2>
        <p class="text-sm text-slate-500 mt-1 font-normal">
          Información de la Escuela
        </p>
      </header>
      <!-- END: HeaderSection -->
      <!-- Top Divider -->
      <hr class="border-t border-slate-100 mt-6 mb-5" />
      <!-- BEGIN: SchoolDetailsList -->
      <div class="space-y-4 text-left" data-purpose="school-details">
        <!-- Field: Nombre -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">Nombre</dt>
          <dd class="text-sm text-slate-500 mt-0.5">Colegio Técnico Neiva</dd>
        </div>
        <!-- Field: Ciudad -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">Ciudad</dt>
          <dd class="text-sm text-slate-500 mt-0.5">Neiva</dd>
        </div>
        <!-- Field: Escolaridad -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">Escolaridad</dt>
          <dd class="text-sm text-slate-500 mt-0.5">Primaria y Bachillerato</dd>
        </div>
        <!-- Field: Dirección -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">Dirección</dt>
          <dd class="text-sm text-slate-500 mt-0.5">Calle 50 #20-30</dd>
        </div>
        <!-- Field: Teléfono -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">Teléfono</dt>
          <dd class="text-sm text-slate-500 mt-0.5">
            <a
              class="hover:text-blue-600 transition-colors"
              href="tel:+5788765432"
              >+57 8 876 5432</a
            >
          </dd>
        </div>
        <!-- Field: Correo Electrónico -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">
            Correo Electrónico
          </dt>
          <dd class="text-sm text-slate-500 mt-0.5">
            <a
              class="hover:text-blue-600 transition-colors"
              href="mailto:info@colegiotecnico.edu.co"
              >info@colegiotecnico.edu.co</a
            >
          </dd>
        </div>
        <!-- Field: Página Web -->
        <div>
          <dt class="text-sm font-semibold text-slate-900">Página Web</dt>
          <dd class="text-sm text-slate-500 mt-0.5">
            <a
              class="hover:text-blue-600 transition-colors"
              href="https://www.colegiotecnico.edu.co"
              rel="noopener noreferrer"
              target="_blank"
              >www.colegiotecnico.edu.co</a
            >
          </dd>
        </div>
      </div>
      <!-- END: SchoolDetailsList -->
      <!-- Bottom Divider -->
      <hr class="border-t border-slate-100 mt-6 mb-6" />
      <!-- BEGIN: ActionsSection -->
      <div class="flex justify-center" data-purpose="modal-actions">
        <button
          class="w-32 py-2.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm text-center shadow-sm shadow-blue-500/20 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          onclick="
            window.history.length & gt;
            1 ? window.history.back() : null;
          "
          type="button"
        >
          Cerrar
        </button>
      </div>
      <!-- END: ActionsSection -->
    </main>
    <!-- END: ModalContainer -->
  </body>
</html>
