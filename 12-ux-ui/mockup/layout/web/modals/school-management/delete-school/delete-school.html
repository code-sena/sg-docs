<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Eliminar Escuela - Confirmación</title>
    <!-- Tailwind CSS v3 CDN with forms and container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- BEGIN: Custom Font and Configuration -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Inter",
                "system-ui",
                "-apple-system",
                "BlinkMacSystemFont",
                "sans-serif",
              ],
            },
            colors: {
              brand: {
                blue: "#215ee8",
                "blue-hover": "#1a4fc2",
              },
              modal: {
                heading: "#151e2f",
                body: "#3f495e",
                circle: "#e8f0fe",
                border: "#dbe2ea",
              },
            },
          },
        },
      };
    </script>
    <!-- END: Custom Font and Configuration -->
    <!-- BEGIN: Custom Styles -->
    <style data-purpose="custom-shadows">
      .modal-shadow {
        box-shadow:
          0 10px 30px -5px rgba(0, 0, 0, 0.05),
          0 20px 25px -5px rgba(0, 0, 0, 0.04);
      }
      .icon-shadow {
        box-shadow: 0 4px 14px 0 rgba(33, 94, 232, 0.08);
      }
    </style>
    <!-- END: Custom Styles -->
  </head>
  <body
    class="min-h-screen bg-slate-100 flex items-center justify-center p-4 font-sans antialiased text-slate-800 selection:bg-blue-100 selection:text-blue-900"
  >
    <!-- BEGIN: ModalContainer -->
    <main class="w-full max-w-[390px]" data-purpose="dialog-wrapper">
      <!-- Card Surface -->
      <div
        class="bg-white rounded-[28px] modal-shadow px-8 pt-9 pb-8 text-center flex flex-col items-center"
        data-purpose="modal-card"
      >
        <!-- BEGIN: HeaderSection -->
        <section
          class="w-full flex flex-col items-center"
          data-purpose="modal-header"
        >
          <!-- Dialog Title -->
          <h1
            class="text-[23px] font-bold tracking-[-0.015em] text-modal-heading leading-tight mb-2.5"
          >
            Eliminar Escuela
          </h1>
          <!-- Descriptive Message -->
          <p
            class="text-[15px] font-normal leading-[1.38] text-modal-body px-2 max-w-[280px]"
          >
            ¿Deseas eliminar esta escuela? Esta acción no se puede deshacer.
          </p>
        </section>
        <!-- END: HeaderSection -->
        <!-- BEGIN: EntityBadgeSection -->
        <section
          class="mt-7 mb-7 flex flex-col items-center w-full"
          data-purpose="entity-preview"
        >
          <!-- School Avatar Icon Circle -->
          <div
            class="w-[88px] h-[88px] rounded-full bg-modal-circle icon-shadow flex items-center justify-center mb-4 transition-transform duration-200 hover:scale-105"
            data-purpose="school-avatar"
          >
            <!-- Graduation Cap / Mortarboard Icon -->
            <svg
              aria-hidden="true"
              class="w-8 h-8 text-modal-heading fill-current -translate-y-2"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"></path>
              <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"></path>
            </svg>
          </div>
          <!-- School Name -->
          <h2
            class="text-[21px] font-bold tracking-tight text-modal-heading px-1"
          >
            Colegio Técnico Neiva
          </h2>
        </section>
        <!-- END: EntityBadgeSection -->
        <!-- BEGIN: ActionButtonsGroup -->
        <nav
          aria-label="Acciones de confirmación"
          class="grid grid-cols-2 gap-3.5 w-full mt-2"
        >
          <!-- Cancel Action -->
          <button
            class="w-full py-3 px-4 rounded-[14px] border border-modal-border bg-white text-[16px] font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-800 active:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-2"
            data-purpose="cancel-button"
            type="button"
          >
            Cancelar
          </button>
          <!-- Confirm Deletion Action -->
          <button
            class="w-full py-3 px-4 rounded-[14px] bg-brand-blue hover:bg-brand-blue-hover text-[16px] font-medium text-white shadow-sm transition-colors active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            data-purpose="confirm-delete-button"
            type="button"
          >
            Eliminar
          </button>
        </nav>
        <!-- END: ActionButtonsGroup -->
      </div>
    </main>
    <!-- END: ModalContainer -->
  </body>
</html>
