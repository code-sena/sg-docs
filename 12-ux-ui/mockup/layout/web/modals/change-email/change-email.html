<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Correo Actualizado</title>
<!-- Tailwind CSS v3 con plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts para tipografía sans-serif moderna -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
<style data-purpose="custom-shadows">
    .modal-card {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 20px 40px -15px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-slate-100/70 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
<!-- BEGIN: SuccessModalSection -->
<main class="w-full flex items-center justify-center" data-purpose="modal-container">
<!-- Tarjeta modal principal con proporciones coincidentes con la referencia -->
<article aria-describedby="modal-description" aria-labelledby="modal-title" class="modal-card bg-white w-full max-w-[448px] rounded-3xl pt-10 pb-9 px-8 flex flex-col items-center text-center border border-slate-100" data-purpose="success-dialog" role="dialog">
<!-- Círculo azul vibrante con checkmark de éxito -->
<div class="w-[66px] h-[66px] rounded-full bg-[#1b5be4] flex items-center justify-center mb-6 shadow-sm" data-purpose="status-icon">
<svg aria-hidden="true" class="w-8 h-8 text-white stroke-[3.5]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7"></path>
</svg>
</div>
<!-- Título principal -->
<h1 class="text-[23px] font-bold text-[#14233c] tracking-tight mb-4" data-purpose="modal-title" id="modal-title">
        Correo actualizado
      </h1>
<!-- Mensaje secundario descriptivo -->
<p class="text-[#64748b] text-[16px] leading-relaxed font-normal mb-8 max-w-[340px]" data-purpose="modal-description" id="modal-description">
        Su correo ha sido actualizado correctamente.
      </p>
<!-- Botón de acción principal redondeado -->
<button class="bg-[#1b5be4] hover:bg-[#154fc9] active:scale-[0.98] transition-all duration-150 text-white font-semibold text-[17px] py-[13px] px-14 rounded-full shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-100" data-purpose="primary-action-button" onclick="this.blur()" type="button">
        Aceptar
      </button>
</article>
</main>
<!-- END: SuccessModalSection -->
</body></html>
