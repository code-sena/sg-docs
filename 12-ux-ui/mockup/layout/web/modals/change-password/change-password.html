<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contraseña actualizada</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: Custom Font & Tailwind Configuration -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#195ce6',
              hover: '#154ec5',
              dark: '#1e293b',
              body: '#64748b'
            }
          },
          boxShadow: {
            'modal': '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.03)'
          }
        }
      }
    }
  </script>
<!-- END: Custom Font & Tailwind Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-styling">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans">
<!-- BEGIN: SuccessModalContainer -->
<main aria-describedby="modal-description" aria-labelledby="modal-title" aria-modal="true" class="w-full max-w-[560px] bg-white rounded-[28px] sm:rounded-[36px] shadow-modal px-8 py-14 sm:py-16 sm:px-14 flex flex-col items-center text-center transition-all" data-purpose="status-modal-card" role="dialog">
<!-- Success Badge / Checkmark Icon -->
<div aria-hidden="true" class="w-[84px] h-[84px] sm:w-[88px] sm:h-[88px] bg-[#195ce6] rounded-full flex items-center justify-center mb-8 shrink-0 shadow-sm" data-purpose="success-icon">
<svg class="w-11 h-11 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
<!-- Modal Title -->
<h1 class="text-[28px] sm:text-[34px] font-bold text-[#1e293b] tracking-tight mb-4" id="modal-title">
      Contraseña actualizada
    </h1>
<!-- Description Message -->
<p class="text-[19px] sm:text-[21px] font-normal text-[#64748b] leading-relaxed max-w-[380px] mb-10" id="modal-description">
      Su contraseña ha sido actualizada correctamente.
    </p>
<!-- Confirmation / Action Button -->
<button class="inline-flex items-center justify-center min-w-[210px] sm:min-w-[220px] px-10 py-3.5 bg-[#195ce6] hover:bg-[#154ec5] active:bg-[#1140a3] text-white text-[20px] sm:text-[21px] font-medium rounded-full transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-blue-100 shadow-sm" data-purpose="submit-button" onclick="handleAccept()" type="button">
      Aceptar
    </button>
</main>
<!-- END: SuccessModalContainer -->
<!-- BEGIN: Basic Interaction Script -->
<script data-purpose="modal-actions">
    function handleAccept() {
      // Intended action when user acknowledges password reset
      console.log('Password update modal confirmed.');
    }
  </script>
<!-- END: Basic Interaction Script -->
</body></html>
