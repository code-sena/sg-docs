<!-- BEGIN: InteractionScript -->
<script data-purpose="theme-selection-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('[data-purpose="theme-card"]');

      cards.forEach(card => {
        card.addEventListener('click', () => {
          // Deactivate all cards
          cards.forEach(c => {
            c.classList.remove('active');
            const badge = c.querySelector('.active-badge');
            if (badge) {
              badge.classList.add('hidden');
            }
          });

          // Activate clicked card
          card.classList.add('active');
          const currentBadge = card.querySelector('.active-badge');
          if (currentBadge) {
            currentBadge.classList.remove('hidden');
          }
        });
      });
    });
  </script>
<!-- END: InteractionScript -->
