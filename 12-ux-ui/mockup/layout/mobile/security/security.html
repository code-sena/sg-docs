<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Seguridad - Guardian Escolar</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBlue: {
              50: '#EFF6FF',
              600: '#1D4ED8',
              700: '#1E40AF',
            },
            appBg: '#F3F6FA',
            appDark: '#0D1B2A',
            appGrayText: '#64748B'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- iOS-like custom styling for switch and touch highlights -->
<style data-purpose="custom-toggle">
    /* iOS style toggle transition and knob positioning */
    .toggle-checkbox:checked {
      right: 0;
      background-color: #2563EB;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #2563EB;
    }
    .toggle-knob {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .toggle-input:checked ~ .toggle-track {
      background-color: #2563EB;
    }
    .toggle-input:checked ~ .toggle-knob {
      transform: translateX(1.375rem);
    }
  </style>
<style data-purpose="base-layout">
    /* Mobile frame styling for desktop simulation & safe area emulation */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center font-sans antialiased text-slate-900">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[430px] h-[100dvh] max-h-[932px] bg-appBg flex flex-col justify-between shadow-2xl relative overflow-hidden sm:rounded-[44px] sm:border-[8px] sm:border-slate-800" data-purpose="mobile-viewport">
<!-- BEGIN: TopAppHeaderSection -->
<header class="w-full flex-shrink-0 bg-transparent pt-3 px-6 z-20" data-purpose="app-header">
<!-- BEGIN: StatusBar -->
<!-- Emulated iOS Status Bar (Time, Signal, Wifi, Battery) -->
<div class="flex justify-between items-center text-slate-900 font-semibold text-[15px] pt-1 pb-3 px-1 tracking-tight" data-purpose="status-bar">
<!-- Digital Clock -->
<span class="font-medium text-base tracking-normal" id="live-clock">2:34</span>
<!-- Status Icons -->
<div class="flex items-center space-x-1.5 text-slate-900">
<!-- Cellular Signal Bars -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4c4.3 0 8.2 1.6 11.2 4.3l-1.4 1.4C19 7.2 15.6 5.8 12 5.8s-7 1.4-9.8 3.9L.8 8.3C3.8 5.6 7.7 4 12 4zm0 4.8c3 0 5.7 1.1 7.8 3l-1.4 1.4c-1.7-1.5-3.9-2.4-6.4-2.4s-4.7.9-6.4 2.4L4.2 11.8c2.1-1.9 4.8-3 7.8-3zm0 4.8c1.6 0 3.1.6 4.3 1.7L12 20l-4.3-4.7c1.2-1.1 2.7-1.7 4.3-1.7z"></path>
</svg>
<!-- Battery Icon with Level -->
<div class="flex items-center">
<div class="w-6 h-[11.5px] border-[1.2px] border-slate-900 rounded-[3px] p-[1px] flex items-center">
<div class="h-full bg-emerald-500 rounded-[1.5px] w-[55%] flex items-center justify-center">
<!-- Battery interior filling -->
</div>
</div>
<div class="w-[1px] h-1 bg-slate-900 rounded-r-[1px] ml-[0.5px]"></div>
<span class="text-[10px] font-bold ml-1">45</span>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<!-- Header bar with back button and screen title -->
<div class="flex items-center space-x-4 py-2" data-purpose="screen-title-bar">
<!-- Back Button -->
<button aria-label="Volver" class="text-slate-900 hover:text-blue-700 active:scale-95 transition-transform duration-150 p-1 -ml-1 focus:outline-none" onclick="history.back ? history.back() : null" type="button">
<svg class="w-7 h-7 stroke-current stroke-[2.4]" fill="none" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Title Text -->
<h1 class="text-2xl font-bold tracking-tight text-slate-900">
          Seguridad
        </h1>
</div>
<!-- END: NavigationBar -->
</header>
<!-- END: TopAppHeaderSection -->
<!-- BEGIN: MainContentSection -->
<main class="flex-1 overflow-y-auto px-5 pt-5 pb-6 space-y-4" data-purpose="main-content">
<!-- BEGIN: NotificationCard -->
<!-- Card for enabling/disabling push notifications -->
<div class="bg-white rounded-2xl p-5 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100 flex items-center justify-between" data-purpose="notification-setting-card">
<div class="flex items-center space-x-4">
<!-- Notification Bell Icon (Blue Outline) -->
<div class="flex-shrink-0 text-appBlue-600">
<svg class="w-7 h-7 stroke-current stroke-[2] fill-none" viewbox="0 0 24 24">
<path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Label and Title -->
<div>
<p class="text-xs font-medium text-slate-500 tracking-wide">Notificaciones</p>
<p class="text-base font-bold text-slate-900 mt-0.5">Activar notificaciones</p>
</div>
</div>
<!-- Interactive iOS Toggle -->
<label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
<input class="sr-only toggle-input" id="notificationToggle" type="checkbox"/>
<div class="toggle-track w-[51px] h-[31px] bg-slate-300 rounded-full transition-colors duration-200 ease-in-out"></div>
<div class="toggle-knob absolute left-[2px] top-[2px] bg-white w-[27px] h-[27px] rounded-full shadow-md pointer-events-none"></div>
</label>
</div>
<!-- END: NotificationCard -->
<!-- BEGIN: PasswordCard -->
<!-- Card for triggering password change flow -->
<div class="bg-white rounded-2xl p-5 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100 flex items-center justify-between cursor-pointer active:scale-[0.99] transition-transform duration-100 focus:outline-none focus:ring-2 focus:ring-blue-500/20" data-purpose="password-setting-card" onclick="alert('Abrir pantalla de cambio de contraseña')" onkeydown="if(event.key === 'Enter') alert('Abrir pantalla de cambio de contraseña')" role="button" tabindex="0">
<div class="flex items-center space-x-4">
<!-- Padlock Icon (Blue Outline) -->
<div class="flex-shrink-0 text-appBlue-600">
<svg class="w-7 h-7 stroke-current stroke-[2] fill-none" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Label and Title -->
<div>
<p class="text-xs font-medium text-slate-500 tracking-wide">Contraseña</p>
<p class="text-base font-bold text-slate-900 mt-0.5">Cambiar la contraseña</p>
</div>
</div>
<!-- Edit/Pen Icon (Blue Outline) -->
<div class="text-appBlue-600 flex-shrink-0 p-1">
<svg class="w-6 h-6 stroke-current stroke-[2] fill-none" viewbox="0 0 24 24">
<path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- END: PasswordCard -->
</main>
<!-- END: MainContentSection -->
<!-- BEGIN: BottomNavigation -->
<!-- Royal blue fixed bottom app bar containing Ruta, Ubicación, Perfil tabs -->
<nav class="w-full bg-appBlue-600 text-white flex justify-around items-center pt-3 pb-6 px-4 shadow-lg z-30" data-purpose="bottom-navigation-bar">
<!-- Tab: Ruta -->
<a class="flex flex-col items-center justify-center space-y-1 group w-1/3 opacity-90 hover:opacity-100 transition-opacity" href="#ruta">
<!-- Bus Icon -->
<svg class="w-7 h-7 fill-current" viewbox="0 0 24 24">
<path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"></path>
</svg>
<span class="text-xs font-medium tracking-normal">Ruta</span>
</a>
<!-- Tab: Ubicación -->
<a class="flex flex-col items-center justify-center space-y-1 group w-1/3 opacity-90 hover:opacity-100 transition-opacity" href="#ubicacion">
<!-- Location Pin Icon -->
<svg class="w-7 h-7 fill-current" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"></path>
</svg>
<span class="text-xs font-medium tracking-normal">Ubicación</span>
</a>
<!-- Tab: Perfil (Active State) -->
<a class="flex flex-col items-center justify-center space-y-1 group w-1/3 opacity-100 transition-opacity" href="#perfil">
<!-- User Avatar Icon -->
<svg class="w-7 h-7 fill-current" viewbox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
<span class="text-xs font-semibold tracking-normal">Perfil</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileDeviceFrame -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="toggle-handling">
    // Add interactive feedback for notification switch
    const toggleInput = document.getElementById('notificationToggle');
    if (toggleInput) {
      toggleInput.addEventListener('change', function(e) {
        // Subtle haptic vibration emulation on mobile browsers if supported
        if ('vibrate' in navigator) {
          navigator.vibrate(10);
        }
      });
    }
  </script>
<!-- END: InteractiveScripts -->
</body></html>
