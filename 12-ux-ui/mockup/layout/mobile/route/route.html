<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Guardian Escolar - Monitoreo de Ruta</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              500: '#3B82F6',
              600: '#1D4ED8',
              700: '#1E40AF',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Map and Layout Styles -->
<style data-purpose="custom-map-styling">
    /* Custom pattern & river styling for the Neiva geographic map render */
    .map-canvas-container {
      background-color: #BDE4A7; /* Vibrant light topographic green from screenshot */
      background-image: 
        radial-gradient(#abdb93 25%, transparent 26%),
        radial-gradient(#c8ebaf 20%, transparent 21%);
      background-size: 80px 80px;
      background-position: 0 0, 40px 40px;
    }

    /* iOS safe-area support */
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
  </style>
<!-- END: Custom Map and Layout Styles -->
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen font-sans antialiased text-slate-800 selection:bg-blue-200">
<!-- BEGIN: Mobile Device Frame -->
<div class="relative w-full max-w-[420px] h-[100dvh] max-h-[915px] bg-white overflow-hidden shadow-2xl flex flex-col sm:rounded-[48px] sm:border-[8px] sm:border-slate-800">
<!-- BEGIN: iOS Dynamic Island & Status Bar Simulation -->
<header class="absolute top-0 inset-x-0 z-40 pt-3 px-7 flex items-center justify-between pointer-events-none" data-purpose="status-bar">
<span class="text-sm font-semibold tracking-tight text-slate-900 ml-1">5:37</span>
<!-- Dynamic Island pill container -->
<div class="h-[30px] w-[125px] bg-black rounded-full flex items-center justify-between px-2.5 shadow-sm">
<!-- Thumbnail icon inside dynamic island -->
<div class="w-4 h-3.5 bg-red-700 rounded-sm flex items-center justify-center overflow-hidden">
<span class="w-1.5 h-1.5 bg-amber-400 rotate-45 transform"></span>
</div>
<!-- Audio waveform wave indicator -->
<div class="flex items-center space-x-[2px] h-3">
<span class="w-[2.5px] h-1.5 bg-orange-500 rounded-full animate-pulse"></span>
<span class="w-[2.5px] h-3 bg-red-500 rounded-full animate-pulse"></span>
<span class="w-[2.5px] h-2 bg-orange-400 rounded-full animate-pulse"></span>
<span class="w-[2.5px] h-3.5 bg-red-400 rounded-full animate-pulse"></span>
</div>
</div>
<!-- Battery and Signal Indicators -->
<div class="flex items-center space-x-1.5 text-slate-900 mr-1">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A10.95 10.95 0 0 1 1 12C1 5.92 5.92 1 12 1s11 4.92 11 11c0 2.33-.73 4.49-1.97 6.27l-.62-.63A8.96 8.96 0 0 0 21 12c0-4.97-4.03-9-9-9zm0 4c-2.76 0-5 2.24-5 5 0 1.29.49 2.47 1.3 3.36l-.7.71A5.96 5.96 0 0 1 5 12c0-3.87 3.13-7 7-7s7 3.13 7 7c0 1.62-.55 3.12-1.48 4.31l-.71-.71c.74-.98 1.19-2.2 1.19-3.6 0-2.76-2.24-5-5-5zm0 4c-.55 0-1 .45-1 1 0 .34.17.63.43.81L12 17l.57-4.19c.26-.18.43-.47.43-.81 0-.55-.45-1-1-1z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M17.778 8.222c-4.296-4.296-11.26-4.296-15.556 0A1 1 0 01.808 6.808c5.076-5.077 13.308-5.077 18.384 0a1 1 0 01-1.414 1.414zM14.95 11.05a7 7 0 00-9.9 0 1 1 0 01-1.414-1.414 9 9 0 0112.728 0 1 1 0 01-1.414 1.414zm-2.829 2.828a3 3 0 00-4.242 0 1 1 0 01-1.415-1.414 5 5 0 017.072 0 1 1 0 01-1.415 1.414zM10 16a1 1 0 110 2 1 1 0 010-2z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Badge with 73 -->
<div class="flex items-center font-bold text-xs">
<span>73</span>
</div>
</div>
</header>
<!-- END: iOS Dynamic Island & Status Bar Simulation -->
<!-- BEGIN: Floating Top Controls (Search & Notification) -->
<div class="absolute top-14 inset-x-0 z-30 px-4 flex items-center space-x-3 pointer-events-auto" data-purpose="map-top-bar">
<!-- Search Box Pill -->
<div class="flex-1 bg-white/95 backdrop-blur-md rounded-2xl shadow-lg shadow-black/5 h-12 flex items-center px-4 border border-white/60">
<svg class="w-5 h-5 text-slate-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<input class="w-full bg-transparent border-none p-0 text-slate-700 placeholder-slate-400 text-base focus:ring-0 font-normal outline-none" placeholder="Buscar ruta" type="text"/>
</div>
<!-- Notification Bell Button -->
<button aria-label="Notificaciones" class="w-12 h-12 bg-white/95 backdrop-blur-md rounded-2xl shadow-lg shadow-black/5 flex items-center justify-center flex-shrink-0 border border-white/60 active:scale-95 transition-transform">
<svg class="w-6 h-6 text-brand-600" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"></path>
</svg>
</button>
</div>
<!-- END: Floating Top Controls -->
<!-- BEGIN: Main Interactive Geographic Map Canvas -->
<main class="relative flex-1 w-full overflow-hidden map-canvas-container" data-purpose="neiva-city-map">
<!-- SVG Vector Map Elements Representing Neiva & Magdalena River -->
<svg class="absolute inset-0 w-full h-full object-cover" preserveaspectratio="xMidYMid slice" viewbox="0 0 400 850" xmlns="http://www.w3.org/2000/svg">
<!-- Defs for patterns & road styles -->
<defs>
<pattern height="14" id="urbanGrid" patternunits="userSpaceOnUse" width="14">
<path d="M 14 0 L 0 0 0 14" fill="none" stroke="#e8f3e5" stroke-width="1.2"></path>
</pattern>
</defs>
<!-- Mountainous & vegetative area accents -->
<path d="M-20,100 Q60,180 30,320 T70,550 T20,780 L-50,850 L-50,0 Z" fill="#b0db95" opacity="0.6"></path>
<path d="M300,-20 Q240,160 310,340 T270,620 T360,820 L450,850 L450,-20 Z" fill="#b0db95" opacity="0.5"></path>
<path d="M220,180 C270,160 360,210 330,300 C300,380 230,360 220,180 Z" fill="#a4d588" opacity="0.7"></path>
<path d="M50,680 C110,640 180,720 120,810 C80,850 30,800 50,680 Z" fill="#9ecc82" opacity="0.65"></path>
<path d="M280,510 C340,490 380,550 350,620 C320,680 260,610 280,510 Z" fill="#a5d78a" opacity="0.6"></path>
<!-- Urban Built-up Density (City of Neiva) -->
<polygon fill="#f8fafc" opacity="0.75" points="120,140 220,150 290,260 320,380 280,560 190,560 140,460 120,290"></polygon>
<polygon fill="url(#urbanGrid)" points="120,140 220,150 290,260 320,380 280,560 190,560 140,460 120,290"></polygon>
<!-- Ipanema residential sector zone -->
<polygon fill="#ffffff" opacity="0.8" points="260,330 350,320 370,390 290,410"></polygon>
<polygon fill="url(#urbanGrid)" points="260,330 350,320 370,390 290,410"></polygon>
<!-- Minor Street Net in Central Area -->
<g stroke="#d5ddd2" stroke-linecap="round" stroke-width="1.2">
<line x1="135" x2="225" y1="180" y2="180"></line>
<line x1="130" x2="245" y1="210" y2="210"></line>
<line x1="125" x2="265" y1="240" y2="240"></line>
<line x1="120" x2="275" y1="270" y2="270"></line>
<line x1="125" x2="280" y1="300" y2="300"></line>
<line x1="130" x2="290" y1="330" y2="330"></line>
<line x1="135" x2="290" y1="360" y2="360"></line>
<line x1="140" x2="270" y1="390" y2="390"></line>
<line x1="150" x2="250" y1="420" y2="420"></line>
<line x1="160" x2="240" y1="450" y2="450"></line>
<line x1="170" x2="230" y1="480" y2="480"></line>
<!-- Diagonal urban grid connections -->
<line x1="140" x2="180" y1="170" y2="380"></line>
<line x1="165" x2="210" y1="160" y2="460"></line>
<line x1="190" x2="230" y1="160" y2="440"></line>
<line x1="215" x2="255" y1="170" y2="400"></line>
<line x1="240" x2="275" y1="200" y2="350"></line>
</g>
<!-- Río Magdalena (Hydrology vector with realistic braided curves) -->
<g fill="none" opacity="0.95" stroke="#4ec3f7" stroke-linecap="round">
<!-- Main channel -->
<path d="M125,-10 C100,50 115,120 70,220 C45,280 90,360 85,410 C80,480 160,540 145,630 C130,710 165,770 155,860" stroke-width="14"></path>
<!-- River braids and secondary channels -->
<path d="M70,220 C60,250 50,300 75,340 C100,380 95,430 80,470 C70,500 115,570 120,620" stroke-width="5"></path>
<path d="M85,410 C110,430 145,460 135,510 C125,560 150,600 155,640" stroke-width="4.5"></path>
<path d="M145,630 C170,680 150,730 168,780" stroke-width="6"></path>
<path d="M125,50 C110,90 120,130 95,170" stroke-width="4"></path>
</g>
<!-- Primary Arterials & Highways (Carrera 1, Avenida 7, Neiva-El Caguán) -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- Secondary Road network -->
<path d="M-10,280 L140,310 L230,270 L340,330 L410,310" stroke="#f1f5f9" stroke-width="4"></path>
<path d="M100,80 L180,180 L200,320 L180,420" stroke="#ffffff" stroke-width="4"></path>
<!-- Carrera 1 (Along Magdalena) -->
<path d="M90,70 Q95,200 150,360 T160,580 L175,760" id="carrera1" stroke="#8d99ae" stroke-width="5"></path>
<path d="M90,70 Q95,200 150,360 T160,580 L175,760" stroke="#cbd5e1" stroke-width="3"></path>
<!-- Avenida 7 -->
<path d="M185,80 L170,200 L215,350 L220,530 L235,680" id="avenida7" stroke="#8d99ae" stroke-width="5"></path>
<path d="M185,80 L170,200 L215,350 L220,530 L235,680" stroke="#e2e8f0" stroke-width="3"></path>
<!-- Highway Neiva - El Caguán -->
<path d="M210,480 Q240,600 420,740" id="neivaCaguan" stroke="#8d99ae" stroke-width="5"></path>
<path d="M210,480 Q240,600 420,740" stroke="#f8fafc" stroke-width="3"></path>
<!-- Cross-city trunk connector -->
<path d="M50,140 C140,160 170,240 280,310 T410,290" stroke="#8d99ae" stroke-width="4"></path>
<path d="M50,140 C140,160 170,240 280,310 T410,290" stroke="#f1f5f9" stroke-width="2.5"></path>
</g>
<!-- Geographic Typography & Map Labels -->
<!-- Magdalena River label along path -->
<path d="M68,230 Q92,150 120,90" fill="none" id="magdalenaPath" stroke="none"></path>
<text fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1" opacity="0.9">
<textpath href="#magdalenaPath" startoffset="10%">Magdalena</textpath>
</text>
<!-- Carrera 1 label along path -->
<path d="M118,300 L110,230" fill="none" id="labelCarrera1" stroke="none"></path>
<text fill="#475569" font-size="8.5" font-weight="600" letter-spacing="0.8">
<textpath href="#labelCarrera1">CARRERA 1</textpath>
</text>
<!-- Avenida 7 label along path -->
<path d="M192,200 L208,125" fill="none" id="labelAv7" stroke="none"></path>
<text fill="#475569" font-size="8.5" font-weight="600" letter-spacing="0.8">
<textpath href="#labelAv7">AVENIDA 7</textpath>
</text>
<!-- Neiva - El Caguán label along path -->
<path d="M340,685 L410,740" fill="none" id="labelCaguan" stroke="none"></path>
<text fill="#475569" font-size="7.5" font-weight="700" letter-spacing="0.8">
<textpath href="#labelCaguan">NEIVA-EL CAGUÁN</textpath>
</text>
<!-- Sectors / Neighborhood Names -->
<text fill="#334155" font-size="10.5" font-weight="700" letter-spacing="0.7" text-anchor="middle" x="195" y="395">EL CENTRO</text>
<text fill="#334155" font-size="10.5" font-weight="700" letter-spacing="0.7" text-anchor="middle" x="305" y="395">IPANEMA</text>
<!-- Prominent City Center Anchor Title -->
<text fill="#1e293b" font-size="24" font-weight="800" letter-spacing="-0.5" text-anchor="middle" x="195" y="520">Neiva</text>
</svg>
<!-- Floating QR Code Card on Lower-Left of Map -->
<div class="absolute left-4 bottom-5 z-20" data-purpose="qr-access-card">
<button aria-label="Código QR de la Ruta" class="bg-white p-2 rounded-2xl border-[2.5px] border-brand-600 shadow-xl shadow-blue-900/15 active:scale-95 transition-all flex items-center justify-center hover:shadow-2xl" title="Escanear Código QR">
<!-- Exact High-Resolution SVG QR Code -->
<svg class="w-16 h-16 text-black" fill="currentColor" viewbox="0 0 100 100">
<!-- Top-Left Target -->
<path d="M10,10 h30 v30 h-30 Z M16,16 v18 h18 v-18 Z M21,21 h8 v8 h-8 Z"></path>
<!-- Top-Right Target -->
<path d="M60,10 h30 v30 h-30 Z M66,16 v18 h18 v-18 Z M71,21 h8 v8 h-8 Z"></path>
<!-- Bottom-Left Target -->
<path d="M10,60 h30 v30 h-30 Z M16,66 v18 h18 v-18 Z M21,71 h8 v8 h-8 Z"></path>
<!-- Custom Data Dots matching visual -->
<rect height="8" rx="1" width="8" x="46" y="12"></rect>
<rect height="8" rx="1" width="8" x="46" y="28"></rect>
<rect height="8" rx="1" width="8" x="12" y="46"></rect>
<rect height="8" rx="1" width="8" x="28" y="46"></rect>
<rect height="8" rx="1" width="16" x="46" y="46"></rect>
<rect height="8" rx="1" width="18" x="70" y="46"></rect>
<rect height="16" rx="1" width="8" x="46" y="62"></rect>
<rect height="8" rx="1" width="16" x="62" y="62"></rect>
<rect height="14" rx="1" width="10" x="80" y="62"></rect>
<rect height="12" rx="1" width="8" x="62" y="78"></rect>
<rect height="10" rx="1" width="12" x="78" y="80"></rect>
</svg>
</button>
</div>
</main>
<!-- END: Main Interactive Geographic Map Canvas -->
<!-- BEGIN: Route Details Bottom Sheet / Card -->
<section class="bg-white pt-5 pb-3 px-6 rounded-t-3xl shadow-[0_-8px_25px_-5px_rgba(0,0,0,0.08)] z-30 border-t border-slate-100" data-purpose="route-info-sheet">
<div class="flex items-start justify-between">
<!-- Left Column: Route title and driver -->
<div>
<h2 class="text-slate-900 font-bold text-xl leading-tight tracking-tight">Ruta Centro</h2>
<p class="text-slate-500 font-medium text-sm mt-0.5">Carlos Pérez</p>
</div>
<!-- Right Column: Bus Plate & Scheduled Hours -->
<div class="text-right">
<span class="text-slate-900 font-bold text-xl leading-tight tracking-wide block">ABC-123</span>
<span class="text-slate-500 font-medium text-xs mt-0.5 tracking-tight block">06:00 AM - 07:30 AM</span>
</div>
</div>
<!-- Subtle separator bars / bottom indicator styling -->
<div class="mt-4 flex items-center justify-between gap-4">
<div class="h-[1px] bg-slate-200/70 flex-1"></div>
<div class="h-[1px] bg-slate-200/70 w-16"></div>
</div>
</section>
<!-- END: Route Details Bottom Sheet -->
<!-- BEGIN: Main Bottom Navigation Bar -->
<nav class="bg-brand-600 px-6 pt-3.5 pb-5 safe-bottom z-30 flex items-center justify-around select-none" data-purpose="bottom-navigation">
<!-- Nav Item: Ruta (Active) -->
<button aria-label="Ruta activa" class="flex flex-col items-center justify-center space-y-1 text-white group focus:outline-none w-20">
<!-- Bus Icon -->
<svg class="w-7 h-7 transform group-hover:scale-110 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"></path>
</svg>
<span class="text-xs font-semibold tracking-normal text-white">Ruta</span>
</button>
<!-- Nav Item: Ubicación -->
<button aria-label="Ubicación" class="flex flex-col items-center justify-center space-y-1 text-white/90 hover:text-white group focus:outline-none w-20">
<!-- Location Pin Icon -->
<svg class="w-7 h-7 transform group-hover:scale-110 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" fill-rule="evenodd"></path>
</svg>
<span class="text-xs font-medium tracking-normal text-white/90">Ubicación</span>
</button>
<!-- Nav Item: Perfil -->
<button aria-label="Perfil" class="flex flex-col items-center justify-center space-y-1 text-white/90 hover:text-white group focus:outline-none w-20">
<!-- User Profile Icon -->
<svg class="w-7 h-7 transform group-hover:scale-110 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" fill-rule="evenodd"></path>
</svg>
<span class="text-xs font-medium tracking-normal text-white/90">Perfil</span>
</button>
</nav>
<!-- END: Main Bottom Navigation Bar -->
</div>
<!-- END: Mobile Device Frame -->
</body></html>
