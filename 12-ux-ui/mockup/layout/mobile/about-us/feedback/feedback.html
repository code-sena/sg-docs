<script data-purpose="rating-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const starButtons = document.querySelectorAll('.star-btn');
      let currentRating = 0;

      // Update visually star filled/outlined state
      function renderStars(rating) {
        starButtons.forEach((button) => {
          const index = parseInt(button.getAttribute('data-index'), 10);
          const svg = button.querySelector('svg');

          if (index <= rating) {
            button.classList.remove('text-slate-400');
            button.classList.add('text-amber-400');
            svg.setAttribute('fill', 'currentColor');
          } else {
            button.classList.add('text-slate-400');
            button.classList.remove('text-amber-400');
            svg.setAttribute('fill', 'none');
          }
        });
      }

      // Star click handler
      starButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const index = parseInt(button.getAttribute('data-index'), 10);
          currentRating = (currentRating === index) ? 0 : index;
          renderStars(currentRating);
        });

        // Hover visual feedback
        button.addEventListener('mouseenter', () => {
          const hoverIndex = parseInt(button.getAttribute('data-index'), 10);
          renderStars(hoverIndex);
        });
      });

      // Restore selected stars on mouse leave
      const starsContainer = document.querySelector('[data-purpose="rating-stars-container"]');
      if (starsContainer) {
        starsContainer.addEventListener('mouseleave', () => {
          renderStars(currentRating);
        });
      }

      // Submit feedback button animation
      const submitBtn = document.getElementById('btn-submit');
      submitBtn.addEventListener('click', () => {
        const textValue = document.getElementById('feedback-text').value.trim();
        const originalText = submitBtn.innerHTML;

        submitBtn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-white mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg> Enviando...`;
        submitBtn.disabled = true;

        setTimeout(() => {
          submitBtn.innerHTML = `<span>¡Enviado!</span>`;
          submitBtn.classList.remove('bg-appBlue');
          submitBtn.classList.add('bg-emerald-600');

          setTimeout(() => {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            submitBtn.classList.add('bg-appBlue');
            submitBtn.classList.remove('bg-emerald-600');
          }, 1800);
        }, 900);
      });
    });
  </script>
