<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Soporte - Guardian Escolar</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#F3F6FA',
              primary: '#1E5BEB',
              primaryDark: '#1648BD',
              textTitle: '#0B1E38',
              textMuted: '#94A3B8',
              cardBorder: '#E2E8F0',
              bottomNav: '#1B5AE3'
            }
          },
          borderRadius: {
            '2.5xl': '1.35rem',
            '3xl': '1.75rem'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Style Block - Layout and Mobile Reset -->
<style data-purpose="layout">
    body {
      background-color: #ECEEF2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Support iPhone safe area insets */
    .safe-top {
      padding-top: max(env(safe-area-inset-top, 16px), 16px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
    }
  </style>
<!-- END: Style Block - Layout and Mobile Reset -->
<!-- BEGIN: Style Block - Custom Form Controls -->
<style data-purpose="form-styling">
    textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(30, 91, 235, 0.2);
    }
  </style>
<!-- END: Style Block - Custom Form Controls -->
</head>
<body class="min-h-screen flex items-center justify-center sm:p-4 text-slate-800">
<!-- BEGIN: Mobile App Shell Container -->
<div class="w-full max-w-md bg-app-bg min-h-screen sm:min-h-[844px] sm:max-h-[900px] flex flex-col justify-between relative shadow-2xl overflow-hidden sm:rounded-[40px] border border-slate-200/80">
<!-- Top Container: Status & Navigation Header -->
<div>
<!-- BEGIN: Top Navigation Bar -->
<header class="bg-white px-5 pt-8 pb-3.5 flex items-center border-b border-slate-100 shadow-sm" data-purpose="app-header">
<!-- Back Button -->
<button aria-label="Volver atrás" class="p-1 -ml-1 text-[#0B1E38] hover:opacity-75 active:scale-95 transition-transform flex items-center justify-center focus:outline-none" id="back-button" type="button">
<svg class="w-7 h-7 stroke-[2.4]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Title -->
<h1 class="text-2xl font-bold text-[#0B1E38] ml-4 tracking-tight">Soporte</h1>
</header>
<!-- END: Top Navigation Bar -->
<!-- BEGIN: Main Support Form -->
<main class="px-5 pt-7 pb-4" data-purpose="support-content">
<!-- Section Heading -->
<h2 class="text-[1.12rem] font-bold text-[#0B1E38] mb-4 tracking-tight">
          Cuéntanos tu inconveniente
        </h2>
<!-- Form Card / Message Field -->
<form class="space-y-6" id="support-form" onsubmit="return false;">
<div class="relative bg-white rounded-3xl border border-[#E2E8F0] shadow-sm p-1">
<label class="sr-only" for="message-input">Escribe aquí tu mensaje...</label>
<textarea class="w-full h-56 p-5 text-slate-800 placeholder-slate-400 text-base resize-none border-0 rounded-3xl bg-transparent focus:ring-0 focus:outline-none" id="message-input" name="mensaje" placeholder="Escribe aquí tu mensaje..." rows="7"></textarea>
</div>
<!-- Submit Button -->
<div>
<button class="w-full py-4 px-6 bg-app-primary hover:bg-app-primaryDark active:scale-[0.98] transition-all duration-150 text-white font-bold text-lg rounded-2.5xl shadow-md shadow-blue-500/20 text-center flex items-center justify-center" id="submit-btn" type="submit">
<span id="btn-text">Enviar</span>
<svg class="hidden animate-spin ml-2 h-5 w-5 text-white" fill="none" id="btn-spinner" viewbox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8v8H4z" fill="currentColor"></path>
</svg>
</button>
</div>
</form>
</main>
<!-- END: Main Support Form -->
</div>
<!-- BEGIN: Confirmation Toast Notification -->
<div class="mx-5 mb-4 p-4 bg-emerald-600 text-white text-sm font-medium rounded-2xl shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-2 flex items-center gap-3" id="toast-message">
<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<span>Tu mensaje ha sido enviado al equipo de soporte.</span>
</div>
<!-- END: Confirmation Toast Notification -->
<!-- BEGIN: Bottom Navigation Bar -->
<nav aria-label="Navegación principal" class="bg-app-bottomNav text-white safe-bottom pt-3 pb-4 px-6 shadow-lg" data-purpose="bottom-navigation">
<ul class="flex items-center justify-between max-w-xs mx-auto">
<!-- Tab 1: Ruta -->
<li>
<a class="flex flex-col items-center gap-1 group py-1 px-3 text-white/90 hover:text-white transition-opacity" href="#ruta">
<!-- School Bus Icon -->
<svg aria-hidden="true" class="w-7 h-7" fill="currentColor" viewbox="0 0 24 24">
<path d="M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"></path>
</svg>
<span class="text-xs font-medium tracking-wide">Ruta</span>
</a>
</li>
<!-- Tab 2: Ubicación -->
<li>
<a class="flex flex-col items-center gap-1 group py-1 px-3 text-white/90 hover:text-white transition-opacity" href="#ubicacion">
<!-- Map Pin / Location Icon -->
<svg aria-hidden="true" class="w-7 h-7" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill-rule="evenodd"></path>
</svg>
<span class="text-xs font-medium tracking-wide">Ubicación</span>
</a>
</li>
<!-- Tab 3: Perfil (Active State) -->
<li>
<a class="flex flex-col items-center gap-1 group py-1 px-3 text-white transition-opacity" href="#perfil">
<!-- Profile Icon -->
<svg aria-hidden="true" class="w-7 h-7" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2.25c-4.14 0-8 2.07-8 6.22 0 .29.24.53.53.53h14.94c.29 0 .53-.24.53-.53 0-4.15-3.86-6.22-8-6.22z" fill-rule="evenodd"></path>
</svg>
<span class="text-xs font-semibold tracking-wide">Perfil</span>
</a>
</li>
</ul>
</nav>
<!-- END: Bottom Navigation Bar -->
</div>
<!-- END: Mobile App Shell Container -->
<!-- BEGIN: Interactive Logic Script -->
<script data-purpose="form-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('support-form');
      const textarea = document.getElementById('message-input');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const toast = document.getElementById('toast-message');
      const backBtn = document.getElementById('back-button');

      // Simple back action simulator
      backBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          alert('Acción volver');
        }
      });

      // Submit handle with visual feedback
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const content = textarea.value.trim();

        if (!content) {
          textarea.focus();
          textarea.parentElement.classList.add('ring-2', 'ring-red-400');
          setTimeout(() => {
            textarea.parentElement.classList.remove('ring-2', 'ring-red-400');
          }, 1500);
          return;
        }

        // Loading animation state
        btnText.textContent = 'Enviando...';
        btnSpinner.classList.remove('hidden');
        submitBtn.disabled = true;

        setTimeout(() => {
          // Success State
          btnText.textContent = 'Enviar';
          btnSpinner.classList.add('hidden');
          submitBtn.disabled = false;
          textarea.value = '';

          // Show Toast
          toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
          toast.classList.add('opacity-100', 'translate-y-0');

          // Hide Toast after 3 seconds
          setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
          }, 3500);
        }, 800);
      });
    });
  </script>
<!-- END: Interactive Logic Script -->
</body></html>
