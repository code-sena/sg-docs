openapi: 3.0.3
info:
  title: Fleet API
  version: 1.0.0
  description: |
    Controller-backed fleet and vehicle-type operations. Kong exposes these
    upstream paths below /fleet; that prefix is stripped before forwarding.
    Request and response DTO shapes below mirror the controller DTOs. Error
    status and body details are included only where the controller returns them.

servers:
  - url: http://localhost:8080/api
    description: Direct local service
  - url: http://localhost:8000/fleet/api
    description: Local Kong gateway (JWT required)

security:
  - bearerAuth: []

tags:
  - name: Buses
  - name: Vehicle types
  - name: GPS devices

paths:
  /gps-devices:
    get:
      summary: List GPS inventory and assigned buses
      description: |
        Requires the buses-management permission. These database inventory UUIDs
        are distinct from the IMEI used by the GPS tracking service.
      tags: [GPS devices]
      responses:
        '200':
          description: GPS inventory.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GpsDevice' }
        '401': { description: Authentication required. }
        '403': { description: Missing buses-management permission. }
  /buses:
    get:
      summary: List buses
      tags: [Buses]
      responses:
        '200':
          description: Bus list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusListItem' }
    post:
      summary: Create a bus
      tags: [Buses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBusRequest' }
      responses:
        '200':
          description: Bus created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateBusResponse' }
        '400': { $ref: '#/components/responses/ProblemBadRequest' }
  /buses/search:
    get:
      summary: Search buses
      tags: [Buses]
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Matching buses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusListItem' }
  /buses/assigned/{profileId}:
    get:
      summary: Get the bus assigned to a driver profile
      tags: [Buses]
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assigned bus, if one is assigned to the driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusAssigned' }
        '403': { description: The caller is not allowed to read this assignment. }
        '404': { $ref: '#/components/responses/NotFound' }
  /buses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get bus details
      tags: [Buses]
      responses:
        '200':
          description: Bus details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update a bus
      tags: [Buses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusRequest' }
      responses:
        '204': { description: Updated; no response body. }
        '400': { $ref: '#/components/responses/ProblemBadRequest' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
    delete:
      summary: Delete a bus
      tags: [Buses]
      responses:
        '204': { description: Deleted; no response body. }
  /buses/{id}/status:
    patch:
      summary: Change bus status
      tags: [Buses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeBusStatusRequest' }
      responses:
        '204': { description: Status changed; no response body. }
        '400': { $ref: '#/components/responses/ProblemBadRequest' }
        '404': { $ref: '#/components/responses/ProblemNotFound' }
  /buses/{busId}/driver:
    parameters:
      - name: busId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Assign a driver to a bus
      tags: [Buses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignDriverRequest' }
      responses:
        '204': { description: Driver assigned; no response body. }
        '400': { $ref: '#/components/responses/TextBadRequest' }
    delete:
      summary: Unassign the driver from a bus
      tags: [Buses]
      responses:
        '204': { description: Driver unassigned; no response body. }
        '400': { $ref: '#/components/responses/TextBadRequest' }
  /vehicle-types/brands:
    get:
      summary: List vehicle brands
      tags: [Vehicle types]
      responses:
        '200':
          description: Vehicle brands.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Brand' }
  /vehicle-types/models:
    get:
      summary: List vehicle models
      tags: [Vehicle types]
      parameters:
        - name: brandId
          in: query
          required: false
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Vehicle models.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VehicleModel' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFound:
      description: Requested bus not found; the controller returns no response body.
    ProblemBadRequest:
      description: Invalid request or rejected domain operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ProblemNotFound:
      description: Bus not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TextBadRequest:
      description: Invalid driver assignment; the controller returns the exception message as text.
      content:
        text/plain:
          schema: { type: string }
  schemas:
    CreateBusRequest:
      type: object
      required: [campuseId, soatValidity, gpsDeviceId, capacity, plate, modelId]
      properties:
        campuseId: { type: string, format: uuid }
        soatValidity: { type: string, format: date-time }
        gpsDeviceId: { type: string, format: uuid }
        capacity: { type: integer, format: int32, minimum: 1, maximum: 255 }
        plate: { type: string, minLength: 1, maxLength: 20 }
        modelId: { type: integer, format: int32, minimum: 1 }
        gpsStatus: { type: boolean, nullable: true }
        gpsImei: { type: string, nullable: true }
    UpdateBusRequest:
      type: object
      properties:
        campuseId: { type: string, format: uuid, nullable: true }
        soatValidity: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, format: int32, minimum: 1, maximum: 255, nullable: true }
        plate: { type: string, minLength: 1, maxLength: 20, nullable: true }
        modelId: { type: integer, format: int32, minimum: 1, nullable: true }
        gpsDeviceId: { type: string, format: uuid, nullable: true }
        gpsStatus: { type: boolean, nullable: true }
        gpsImei: { type: string, nullable: true }
    ChangeBusStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Active, Inactive]
          example: Active
    AssignDriverRequest:
      type: object
      required: [profileId]
      properties:
        profileId: { type: string, format: uuid }
    CreateBusResponse:
      type: object
      required: [busId]
      properties:
        busId: { type: string, format: uuid }
    BusListItem:
      type: object
      required: [id, plate, campuseId, driverName, brand, model, status]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string }
        campuseId: { type: string, format: uuid }
        driverName: { type: string }
        brand: { type: string }
        model: { type: string }
        status: { type: string }
    BusDetail:
      type: object
      required: [id, plate, campuseId, soatValidity, gpsDeviceId, capacity, modelId, status, driverName, brand, model, gpsImei]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string }
        campuseId: { type: string, format: uuid }
        soatValidity: { type: string, format: date-time }
        gpsDeviceId: { type: string, format: uuid }
        capacity: { type: integer, format: int32, minimum: 0, maximum: 255 }
        modelId: { type: integer, format: int32, minimum: 0, maximum: 255 }
        status: { type: string }
        driverName: { type: string }
        brand: { type: string }
        model: { type: string }
        gpsImei: { type: string }
        gpsStatus: { type: boolean, nullable: true }
        driverProfileId: { type: string, format: uuid, nullable: true }
    BusAssigned:
      type: object
      required: [id, plate, campuseId]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string }
        campuseId: { type: string, format: uuid }
    GpsDevice:
      type: object
      required: [id, imei, gpsStatus]
      properties:
        id: { type: string, format: uuid }
        imei: { type: string }
        gpsStatus: { type: boolean }
        assignedBusId: { type: string, format: uuid, nullable: true }
        assignedPlate: { type: string, nullable: true }
    Brand:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0, maximum: 255 }
        name: { type: string }
    VehicleModel:
      type: object
      required: [id, name, brandId, brandName]
      properties:
        id: { type: integer, format: int32, minimum: 0, maximum: 255 }
        name: { type: string }
        brandId: { type: integer, format: int32, minimum: 0, maximum: 255 }
        brandName: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
