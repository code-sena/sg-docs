openapi: 3.0.3
info:
  title: GPS API
  version: 1.0.0
  description: |
    HTTP endpoints exposed by the GPS REST controllers. Device and location
    data are retained in process memory; this API does not expose history,
    device registration, or status mutation endpoints.

    The application has no REST health controller. The gateway applies its
    JWT plugin to /api/gps; direct requests to the local service do not pass
    through that gateway policy.

servers:
  - url: http://localhost:8080
    description: Direct local service
  - url: http://localhost:8000
    description: Local Kong gateway (JWT required)

security:
  - bearerAuth: []

tags:
  - name: GPS
    description: GPS devices and latest in-memory location.
  - name: Test
    description: Synthetic test-location endpoint exposed by the current controller.

paths:
  /api/gps/devices/{imei}:
    get:
      summary: Get a registered GPS device
      description: |
        Returns the device tracked by IMEI. If it has not been registered by
        incoming device traffic, the controller returns null; Spring MVC
        responds with HTTP 200 and no response body rather than HTTP 404.
      tags: [GPS]
      parameters:
        - name: imei
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Device JSON when known; otherwise an empty response body.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GpsDevice'
                nullable: true
  /api/gps/devices/{imei}/connected:
    get:
      summary: Check whether a GPS device is connected
      description: Returns false when no device is registered for the IMEI.
      tags: [GPS]
      parameters:
        - name: imei
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema: { type: boolean }
  /api/gps/devices/{imei}/location:
    get:
      summary: Get the latest location
      description: |
        Returns the most recently retained location. If no location exists for
        the IMEI, the controller returns null and Spring MVC responds with
        HTTP 200 and no response body rather than HTTP 404.
      tags: [GPS]
      parameters:
        - name: imei
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Location JSON when known; otherwise an empty response body.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GpsLocation'
                nullable: true
  /api/gps/test/{imei}:
    post:
      summary: Create a synthetic GPS test location
      description: |
        Stores and returns a fixed sample location for the supplied IMEI.
        This endpoint is present in the current controller and is not declared
        as a development-only route.
      tags: [Test]
      parameters:
        - name: imei
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The synthetic location saved by the controller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GpsLocation' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GpsDevice:
      type: object
      required: [imei, gpsStatus]
      properties:
        imei: { type: string }
        gpsStatus: { type: boolean }
        lastConnection:
          type: string
          format: date-time
          nullable: true
    GpsLocation:
      type: object
      required: [imei, latitude, longitude, speed, course]
      properties:
        imei: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        speed: { type: number, format: double }
        course: { type: number, format: double }
        dateTime:
          type: string
          format: date-time
          nullable: true
        gpsDateTime:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true
        timestampStatus:
          type: string
          enum: [VALID, STALE, INVALID]
          nullable: true
        status:
          type: string
          nullable: true
        positionType:
          type: string
          enum: [UNKNOWN, REAL_TIME, RE_UPLOAD]
          nullable: true
