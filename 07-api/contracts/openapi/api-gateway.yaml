openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Kong is the reverse-proxy entry point. Its configured upstream routes and
    authentication behavior are described in the gateway configuration and
    individual service contracts. The current Kong configuration does not
    define a public /health endpoint; therefore this document declares no
    gateway-owned HTTP operations.

servers:
  - url: http://localhost:8000
    description: Local Kong gateway

paths: {}

components:
