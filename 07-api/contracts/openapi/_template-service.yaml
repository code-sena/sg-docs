openapi: 3.0.3
info:
  title: Service API
  version: 1.0.0
  description: |
    Starting point for a service contract. Replace the example resource,
    fields, server variables, and operations with endpoints verified in the
    owning service before publishing the contract.

servers:
  - url: http://localhost:8080/api/v1
    description: Local service
  - url: https://api.{domain}/api/v1/{service}
    description: Gateway; confirm its route and strip-path behavior.
    variables:
      domain:
        default: example.com
      service:
        default: service-name

security:
  - bearerAuth: []

tags:
  - name: Resource
    description: Example resource operations; replace with verified service tags.
  - name: Health
    description: Service health checks.

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
  /resources:
    get:
      summary: List resources
      tags: [Resource]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - name: filter
          in: query
          description: Replace with a verified filter.
          schema: { type: string }
      responses:
        '200':
          description: Resource list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResourceResponse' }
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
    post:
      summary: Create resource
      tags: [Resource]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
  /resources/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IdParam'
    get:
      summary: Get resource
      tags: [Resource]
      responses:
        '200':
          description: Resource found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    patch:
      summary: Update resource
      tags: [Resource]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateResourceRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Delete resource
      tags: [Resource]
      responses:
        '204':
          description: Deleted; no response body.
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

components:
  schemas:
    CreateResourceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
    UpdateResourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
    ResourceResponse:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: './_shared.yaml#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
          nullable: true
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
