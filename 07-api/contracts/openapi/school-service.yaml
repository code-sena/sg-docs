openapi: 3.0.3
info:
  title: "School API"
  version: 1.0.0
  description: |
    Schools and campus lookup endpoints.

    ## Autenticacion
    The Kong route uses /school-management and strips that prefix before
    forwarding; the remaining /api/v1/... path is preserved.

    Protected endpoints require JWT:
    Authorization: Bearer <token>

    ## Errores
    Invalid school/campus requests return HTTP 400 Problem Details.
    Authentication and not-found failures may have no response body.

    ## Entrada publica
    En produccion/dev el trafico pasa por Kong OSS en :8000.
    Desarrollo local directo al servicio: http://localhost:8080

    ## Documentacion
    Interactiva via Scalar (ADR-007), no Swagger UI.

servers:
  - url: http://localhost:8080/api/v1
    description: Direct local service
  - url: http://localhost:8000/school-management/api/v1
    description: Local Kong gateway (JWT required)

security:
  - bearerAuth: []

tags:
  - name: School
    description: Schools and campus lookup endpoints.

paths:
  /schools:
    get:
      summary: List schools
      tags: [School]
      responses:
        '200':
          description: School list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SchoolList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create school
      tags: [School]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolRequest' }
      responses:
        '201': { description: Created; no response body. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /schools/search:
    get:
      summary: Search schools
      tags: [School]
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matching schools.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SchoolList' } }
  /schools/with-campuses:
    post:
      summary: Create a school with campuses
      tags: [School]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolWithCampusesRequest' }
      responses:
        '201':
          description: School and campuses created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolWithCampusesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /schools/{id}:
    get:
      summary: Get school
      tags: [School]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Update school
      tags: [School]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolRequest' }
      responses:
        '204': { description: Updated; no response body. }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      summary: Delete school
      tags: [School]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted; no response body. }
  /schools/{id}/campuses:
    get:
      summary: List campuses for a school
      tags: [School]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: School campuses
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SchoolCampusResponse' } }
  /schools/{id}/with-campuses:
    put:
      summary: Update a school and its campuses
      tags: [School]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolWithCampusesRequest' }
      responses:
        '204': { description: Updated; no response body. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /campuses/{id}:
    get:
      summary: Get campus
      tags: [School]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampusDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Missing or invalid JWT; response body depends on gateway or service.
    NotFound:
      description: Resource not found; no response body is guaranteed.
  schemas:
    SchoolRequest:
      type: object
      required: [logo, name, address, email]
      description: |
        SchoolRequestDto. Coordinates may both be null/omitted, or must both
        be supplied together. The address limits apply before persistence.
      properties:
        cityId: { type: string, format: uuid }
        logo: { type: string, format: byte }
        name: { type: string }
        address: { type: string, minLength: 5, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        phone: { type: integer, format: int64 }
        email: { type: string }
        website: { type: string, nullable: true }
        theme: { type: string, nullable: true }
        status: { type: string, nullable: true }
    SchoolCampusRequest:
      type: object
      required: [name, address]
      description: |
        Coordinates must be supplied together or both absent. Names must be
        unique within the request; existing IDs cannot be repeated. New campuses
        must be Active; Inactive campuses require an existing ID.
      properties:
        id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 30 }
        address: { type: string, minLength: 5, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        status: { type: string, enum: [Active, Inactive], default: Active }
    SchoolWithCampusesRequest:
      allOf:
        - $ref: '#/components/schemas/SchoolRequest'
        - type: object
          required: [campuses]
          properties:
            campuses:
              type: array
              items: { $ref: '#/components/schemas/SchoolCampusRequest' }
            removedCampusIds:
              type: array
              nullable: true
              items: { type: string, format: uuid }
              description: IDs cannot also be present in campuses.
    SchoolList:
      type: object
      properties:
        id: { type: string, format: uuid }
        cityId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        status: { type: string }
    SchoolResponse:
      allOf:
        - $ref: '#/components/schemas/SchoolRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
            cityName: { type: string }
    SchoolCampusResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        status: { type: string }
    SchoolWithCampusesResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        campuses:
          type: array
          items: { $ref: '#/components/schemas/SchoolCampusResponse' }
    CampusDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        status: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
      additionalProperties: true
